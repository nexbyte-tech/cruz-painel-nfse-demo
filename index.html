<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel de NFS-e · Cruz Sociedade de Contadores (demonstração)</title>
<style>
:root{
  --bg:#f5f5ef;--card:#fff;--text:#14302e;--muted:#5b6b68;--border:#e3e3d8;--soft:#eef0e6;
  --side:#0d3636;--side-active:#1b4a46;--side-text:#e9efe9;--side-muted:#aba77b;
  --primary:#216361;--primary-text:#fff;--primary-soft:#e2efec;--gold:#aba77b;--bar:#23655f;--weekend:#c4c39f;
  --warn-bg:#fcf0d6;--warn-text:#7a4a05;--warn-dot:#d18a0b;--ok-bg:#e0f1e6;--ok-text:#14663a;--ok-dot:#1f9a55;
  --err-bg:#fbe0dd;--err-text:#a1261b;--err-dot:#d33a2c;--info-bg:#e1e9fb;--info-text:#1f3f9a;--info-dot:#2f5fd0;
  --mute-bg:#ebebe3;--mute-text:#555;--shadow:0 1px 2px rgba(13,54,54,.06);--focus:#2f5fd0;
}
[data-theme="dark"]{
  --bg:#0a1c1c;--card:#112a2a;--text:#e6eee9;--muted:#9bb0aa;--border:#1f3f3d;--soft:#163533;
  --side:#0d3636;--side-active:#1b4a46;--side-text:#e6eee9;--side-muted:#aba77b;
  --primary:#3aa39a;--primary-text:#04201e;--primary-soft:#173e3b;--gold:#aba77b;--bar:#3aa39a;--weekend:#5d5f48;
  --warn-bg:#3a2d0e;--warn-text:#f2c46b;--warn-dot:#e9a62a;--ok-bg:#12351f;--ok-text:#7fd9a2;--ok-dot:#38c77a;
  --err-bg:#431a17;--err-text:#ff9f95;--err-dot:#ff6a5b;--info-bg:#17294d;--info-text:#9db8ff;--info-dot:#6b93ff;
  --mute-bg:#1c3533;--mute-text:#b3c3be;--shadow:none;--focus:#8fb0ff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--primary)}
.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--side-text);padding:22px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
aside img.logo{width:100%;max-width:230px;display:block;margin:0 0 14px 2px}
.sidetitle{font-size:12px;letter-spacing:.16em;color:var(--side-muted);font-weight:600;margin:0 0 14px 4px}
.sidegroup{font-size:11px;letter-spacing:.14em;color:var(--side-muted);margin:16px 0 6px 6px;text-transform:uppercase;opacity:.85}
nav button{display:flex;width:100%;align-items:center;justify-content:space-between;background:none;border:0;color:var(--side-text);text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:15px}
nav button:hover{background:rgba(255,255,255,.06)}
nav button.active{background:var(--side-active);font-weight:600;box-shadow:inset 3px 0 0 var(--gold)}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;background:#f3c14b;color:#4b3200}
.pill.red{background:#f0a3a0;color:#561410}
.pill.soon{background:none;color:var(--side-muted);font-weight:400}
.sidefoot{margin-top:auto;padding:16px 4px 0;font-size:13px;color:var(--side-muted)}
.sidefoot b{color:var(--side-text);display:block;font-size:14px}
.main{padding:22px 32px 48px;min-width:0}
.demobar{background:var(--info-bg);color:var(--info-text);border:1px solid var(--info-dot);border-radius:12px;padding:8px 14px;font-size:13.5px;margin-bottom:18px}
.demobar b{font-weight:700}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:30px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.iconbtn{background:var(--card);border:1px solid var(--border);border-radius:999px;height:38px;min-width:38px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--shadow)}
.iconbtn:hover{border-color:var(--primary)}
.hamb{display:none}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin:0 0 14px}
.card h3{font-size:15px;margin:0 0 8px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g21{grid-template-columns:2fr 1fr}
.mt{margin-top:16px}
.alert{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--warn-bg);color:var(--warn-text);border:1px solid var(--warn-dot);border-radius:14px;padding:12px 16px;margin-bottom:16px;font-weight:600}
.alert a,.linkbtn{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font-weight:600;padding:0}
.kpi .lbl{color:var(--muted);font-size:14px}.kpi .num{font-size:38px;font-weight:700;line-height:1.15;margin:4px 0}
.kpi .hint{color:var(--muted);font-size:14px}
.c-warn{color:var(--warn-text)}.c-ok{color:var(--ok-text)}.c-err{color:var(--err-text)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-warn{background:var(--warn-bg);color:var(--warn-text)}.b-ok{background:var(--ok-bg);color:var(--ok-text)}
.b-err{background:var(--err-bg);color:var(--err-text)}.b-info{background:var(--info-bg);color:var(--info-text)}.b-mute{background:var(--mute-bg);color:var(--mute-text)}
.btn{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);color:var(--primary-text);border-color:var(--primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--err-text);border-color:var(--err-dot)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);font-size:13.5px}
td{padding:11px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.tablewrap{overflow-x:auto}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
label{display:block;font-size:13.5px;color:var(--muted);margin-bottom:4px;font-weight:600}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=time],select,textarea{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 10px}
textarea{min-height:130px;resize:vertical;font-family:inherit}
input:disabled,select:disabled{opacity:.6}
.field{margin-bottom:12px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form2 .full{grid-column:1/-1}
.bars{display:flex;align-items:flex-end;gap:7px;height:190px;padding-top:10px}
.bars .b{flex:1;background:var(--bar);border-radius:5px 5px 0 0;min-height:4px;cursor:pointer;border:0;padding:0}
.bars .b.we{background:var(--weekend)}.bars .b:hover,.bars .b:focus-visible{filter:brightness(1.2);outline-offset:1px}
.bars-foot{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:8px}
.prog{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}.prog>i{display:block;height:100%;background:var(--bar);border-radius:99px;transition:width .4s}
.prog.warn>i{background:var(--warn-dot)}.prog.err>i{background:var(--err-dot)}
.funnel .r{margin-bottom:11px}.funnel .t{display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:3px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;background:var(--ok-dot)}
.dot.warn{background:var(--warn-dot)}.dot.err{background:var(--err-dot)}.dot.load{background:var(--info-dot);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.svc{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);gap:12px}
.svc:last-child{border-bottom:0}.svc small{color:var(--muted);display:block}
.switch{position:relative;display:inline-block;width:44px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--mute-bg);border:1px solid var(--border);border-radius:99px;transition:.2s;cursor:pointer}
.switch span::before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:var(--muted);border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--primary);border-color:var(--primary)}
.switch input:checked+span::before{transform:translateX(20px);background:var(--primary-text)}
.switch input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.opt:last-child{border-bottom:0}.opt small{color:var(--muted);display:block}
.note{color:var(--muted);font-size:13.5px}
.callout{background:var(--primary-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.callout.warn{background:var(--warn-bg);color:var(--warn-text)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14.5px}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;background:var(--soft);border-radius:6px;padding:1px 6px}
.modalbg{position:fixed;inset:0;background:rgba(5,20,20,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--card);border-radius:18px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:24px;border:1px solid var(--border)}
.modal h2{margin:0 0 14px;font-size:20px}
.modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:70;max-width:min(420px,calc(100vw - 36px))}
.toast{background:var(--side);color:#fff;border-left:4px solid var(--gold);padding:11px 14px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:14.5px;animation:in .25s}
.toast.ok{border-left-color:#38c77a}.toast.err{border-left-color:#ff6a5b}.toast.warn{border-left-color:#e9a62a}
@keyframes in{from{transform:translateY(10px);opacity:0}}
.notifpanel{position:absolute;right:0;top:46px;width:min(360px,92vw);background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:40;padding:8px}
.notifpanel .n{padding:10px;border-radius:10px;font-size:14px;display:flex;gap:10px}.notifpanel .n.unread{background:var(--primary-soft)}
.relative{position:relative}
.cnt{background:var(--err-dot);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;font-weight:700}
.login{position:fixed;inset:0;background:var(--side);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.login .box{background:var(--card);border-radius:20px;padding:30px;width:min(420px,100%)}
.login img{width:230px;display:block;margin:-6px auto 14px;border-radius:8px}
.tag-demo{display:inline-block;background:var(--info-bg);color:var(--info-text);border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700;margin-left:8px;vertical-align:middle}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{border:1px solid var(--border);background:var(--card);padding:6px 14px;border-radius:99px;cursor:pointer;font-weight:600}.tabs button.on{background:var(--primary);color:var(--primary-text);border-color:var(--primary)}
.hide{display:none!important}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g21,.g3{grid-template-columns:1fr}}
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;bottom:0;width:272px;transform:translateX(-102%);transition:.25s;z-index:45;height:100%}
  aside.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.5)}
  .hamb{display:inline-flex}.main{padding:16px}.g2,.g4,.form2{grid-template-columns:1fr}h1{font-size:25px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const digits=s=>String(s||"").replace(/\D/g,"");
function cpfOk(v){v=digits(v);if(v.length!==11||/^(\d)\1+$/.test(v))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=v[i]*(t+1-i);const d=((s*10)%11)%10;if(d!=v[t])return false}return true}
function cnpjOk(v){v=digits(v);if(v.length!==14||/^(\d)\1+$/.test(v))return false;for(let t=12;t<14;t++){let s=0,p=t-7;for(let i=0;i<t;i++){s+=v[i]*p--;if(p<2)p=9}const d=s%11<2?0:11-s%11;if(d!=v[t])return false}return true}
const docOk=v=>{const d=digits(v);return d.length===11?cpfOk(d):d.length===14?cnpjOk(d):false};
function cnpjFrom(b){b=String(b).padStart(12,"0");let a=b.split("").map(Number);for(let t=12;t<14;t++){let s=0,p=t-7;for(let i=0;i<t;i++){s+=a[i]*p--;if(p<2)p=9}a.push(s%11<2?0:11-s%11)}return a.join("")}

function notify(txt,t="warn"){S.notifs.unshift({id:Date.now()+Math.random(),txt,t,read:false});renderBell()}
function renderBell(){const c=S.notifs.filter(n=>!n.read).length;$("#bellCnt").textContent=c;$("#bellCnt").classList.toggle("hide",!c);
  $("#notifPanel").innerHTML=`<div class="spread" style="padding:6px 8px"><b>Notificações</b><button class="linkbtn" data-act="readAll">Marcar todas como lidas</button></div>`+(S.notifs.length?S.notifs.slice(0,8).map(n=>`<div class="n ${n.read?"":"unread"}"><span class="dot ${n.t==="err"?"err":n.t==="warn"?"warn":""}" style="margin-top:6px;flex:none"></span><span>${esc(n.txt)}</span></div>`).join(""):'<p class="note" style="padding:8px">Nenhuma notificação.</p>')}
let modalPrev=null;
function modal(title,body,actions=[]){closeModal();modalPrev=document.activeElement;const r=$("#modalRoot");
  r.innerHTML=`<div class="modalbg" data-act="modalBg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">${esc(title)}</h2><div id="mb">${body}</div><div class="acts">${actions.map((a,i)=>`<button class="btn ${a.cls||""}" data-macts="${i}">${esc(a.label)}</button>`).join("")}</div></div></div>`;
  $$("[data-macts]",r).forEach(b=>b.addEventListener("click",()=>{const a=actions[b.dataset.macts];const keep=a.fn?a.fn():undefined;if(keep!==false&&!a.stay)closeModal()}));
  const f=$("input,select,textarea,button.btn",r);f&&f.focus()}
function closeModal(){$("#modalRoot").innerHTML="";if(modalPrev&&modalPrev.focus&&document.contains(modalPrev))modalPrev.focus();modalPrev=null}

const badge=o=>{const s=ST[o.status];return `<span class="badge ${s[0]}">${o.status==="erro"?esc("Inconsistência: "+o.error):s[1]}</span>`};
function validate(o){if(!o.taker||!o.taker.trim())return "Tomador não informado";if(!docOk(o.doc))return "CPF/CNPJ do tomador inválido";if(!(o.value>0))return "Valor não informado no e-mail";if(!o.desc||o.desc.trim().length<5)return "Descrição do serviço muito curta";return ""}

  </div>

  </div>
  <div class="card mt"><div class="spread"><h2>Atividade recente</h2><button class="linkbtn" data-nav="orders">Ver todos os pedidos</button></div>
   <div class="tablewrap"><table><thead><tr><th>Hora</th><th>Cliente (prestador)</th><th>Tomador</th><th class="num">Valor</th><th>Situação</th></tr></thead><tbody>${recent.map(x=>`<tr class="click" data-order="${x.id}"><td>${fTime(x.created)}</td><td>${esc(x.client)}</td><td>${esc(x.taker)}</td><td class="num">${x.value?brl(x.value):"-"}</td><td>${badge(x)}</td></tr>`).join("")}</tbody></table></div></div>`};

function orderRows(){const q=ORDER_FILTER.q.toLowerCase();return [...S.orders].filter(o=>(!ORDER_FILTER.st||o.status===ORDER_FILTER.st)&&(!q||(o.client+o.taker+o.desc+o.id).toLowerCase().includes(q))).sort((a,b)=>b.created-a.created)
  .map(x=>`<tr class="click" data-order="${x.id}"><td>#${x.id}</td><td>${fTime(x.created)}</td><td>${esc(x.client)}</td><td>${esc(x.taker)}</td><td class="num">${x.value?brl(x.value):"-"}</td><td>${badge(x)}</td></tr>`).join("")||`<tr><td colspan="6" class="note">Nenhum pedido encontrado.</td></tr>`}
VIEWS.orders=()=>`<div class="card"><div class="spread" style="margin-bottom:14px"><div class="row"><input type="text" id="oq" placeholder="Buscar cliente, tomador ou nº" value="${esc(ORDER_FILTER.q)}" style="width:260px" aria-label="Buscar pedidos"><select id="ost" style="width:auto" aria-label="Filtrar por situação"><option value="">Todas as situações</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${ORDER_FILTER.st===k?"selected":""}>${v[1]}</option>`).join("")}</select></div><button class="btn primary" data-act="newOrder">Simular pedido por e-mail</button></div>
 <div class="tablewrap"><table><thead><tr><th>Nº</th><th>Hora</th><th>Cliente (prestador)</th><th>Tomador</th><th class="num">Valor</th><th>Situação</th></tr></thead><tbody id="obody">${orderRows()}</tbody></table></div></div>`;
VIEWS.orders_after=()=>{$("#oq").addEventListener("input",e=>{ORDER_FILTER.q=e.target.value;$("#obody").innerHTML=orderRows()});$("#ost").addEventListener("change",e=>{ORDER_FILTER.st=e.target.value;$("#obody").innerHTML=orderRows()})};

VIEWS.approvals=()=>{const l=S.orders.filter(o=>o.status==="aguardando").sort((a,b)=>a.created-b.created);
  if(!l.length)return `<div class="card"><h2>Tudo em dia</h2><p>Não há pedidos aguardando aprovação.</p></div>`;
  return `<div class="spread" style="margin-bottom:14px"><span class="note">${l.length} pedido(s) · modo: <b>${esc(S.cfg.mode)}</b>${S.cfg.mode==="Manual"?` (automático após ${S.cfg.autoAfter} dias de acompanhamento)`:""}</span><button class="btn primary" data-act="approveAll" ${can.approve()?"":"disabled"}>Aprovar todos os válidos</button></div>
  <div class="grid g2">${l.map(o=>{const e=validate(o);return `<div class="card" data-card="${o.id}"><div class="spread"><b>#${o.id} · ${esc(o.client)}</b><span class="badge b-warn">${ago((new Date()-o.created)/60000)}</span></div>
  <div class="form2 mt"><div class="field"><label>Tomador</label><input type="text" data-f="taker" value="${esc(o.taker)}"></div><div class="field"><label>CPF/CNPJ</label><input type="text" data-f="doc" value="${esc(fmtDoc(o.doc))}"></div><div class="field"><label>Valor (R$)</label><input type="text" data-f="value" value="${o.value?o.value.toLocaleString("pt-BR",{minimumFractionDigits:2}):""}"></div><div class="field"><label>Validação automática</label><div>${e?`<span class="badge b-err">${esc(e)}</span>`:'<span class="badge b-ok">Dados conferidos</span>'}</div></div><div class="field full"><label>Descrição do serviço</label><input type="text" data-f="desc" value="${esc(o.desc)}"></div></div>
  <div class="row"><button class="btn primary" data-act="approve" data-id="${o.id}" ${can.approve()?"":"disabled"}>Aprovar e emitir</button><button class="btn" data-act="saveOrder" data-id="${o.id}">Salvar edição</button><button class="btn danger" data-act="reject" data-id="${o.id}" ${can.approve()?"":"disabled"}>Devolver ao cliente</button></div></div>`}).join("")}</div>${can.approve()?"":'<p class="note mt">O perfil Visualizador não pode aprovar.</p>'}`};

VIEWS.errors=()=>{const l=S.orders.filter(o=>o.status==="erro");if(!l.length)return `<div class="card"><h2>Sem inconsistências</h2><p>Nenhum pedido com erro no momento.</p></div>`;
  return `<div class="grid g2">${l.map(o=>`<div class="card" data-card="${o.id}"><div class="spread"><b>#${o.id} · ${esc(o.client)}</b><span class="badge b-err">${esc(o.error)}</span></div>
  <p class="note">Corrija o dado abaixo e envie de volta para aprovação, ou devolva ao cliente pedindo a informação correta.</p>
  <div class="form2"><div class="field"><label>Tomador</label><input type="text" data-f="taker" value="${esc(o.taker)}"></div><div class="field"><label>CPF/CNPJ</label><input type="text" data-f="doc" value="${esc(fmtDoc(o.doc))}"></div><div class="field"><label>Valor (R$)</label><input type="text" data-f="value" value="${o.value?o.value.toLocaleString("pt-BR",{minimumFractionDigits:2}):""}"></div><div class="field"><label>Descrição</label><input type="text" data-f="desc" value="${esc(o.desc)}"></div></div>
  <div class="row"><button class="btn primary" data-act="fixOrder" data-id="${o.id}">Corrigir e enviar para aprovação</button><button class="btn" data-act="askClient" data-id="${o.id}">Pedir correção ao cliente</button><button class="btn danger" data-act="discard" data-id="${o.id}">Descartar</button></div></div>`).join("")}</div>`};

function noteRows(){const q=NOTE_FILTER.q.toLowerCase(),from=addDays(NOW,-parseInt(NOTE_FILTER.days));from.setHours(0,0,0,0);
  const l=S.notes.filter(n=>n.date>=from&&(!q||(n.client+n.taker+n.n).toLowerCase().includes(q))).sort((a,b)=>b.date-a.date);
  return {html:l.slice(0,60).map(n=>`<tr class="click" data-note="${n.n}"><td>${n.n}</td><td>${fDT(n.date)}</td><td>${esc(n.client)}</td><td>${esc(n.taker)}</td><td class="num">${brl(n.value)}</td></tr>`).join("")||`<tr><td colspan="5" class="note">Nenhuma nota no período.</td></tr>`,count:l.length,total:l.reduce((s,n)=>s+n.value,0),list:l}}
VIEWS.notes=()=>{const r=noteRows();return `<div class="card"><div class="spread" style="margin-bottom:14px"><div class="row"><input type="text" id="nq" placeholder="Buscar cliente, tomador ou nº" value="${esc(NOTE_FILTER.q)}" style="width:260px" aria-label="Buscar notas"><select id="nd" style="width:auto" aria-label="Período">${[["1","Hoje"],["7","Últimos 7 dias"],["14","Últimos 14 dias"],["30","Últimos 30 dias"]].map(([v,l])=>`<option value="${v}" ${NOTE_FILTER.days===v?"selected":""}>${l}</option>`).join("")}</select></div><button class="btn" data-act="exportCsv">Exportar CSV</button></div>
  <p class="note" id="nsum"><b>${r.count}</b> notas · total <b>${brl(r.total)}</b></p><div class="tablewrap"><table><thead><tr><th>Nº</th><th>Data</th><th>Cliente (prestador)</th><th>Tomador</th><th class="num">Valor</th></tr></thead><tbody id="nbody">${r.html}</tbody></table></div></div>`};
VIEWS.notes_after=()=>{const upd=()=>{const r=noteRows();$("#nbody").innerHTML=r.html;$("#nsum").innerHTML=`<b>${r.count}</b> notas · total <b>${brl(r.total)}</b>`};$("#nq").addEventListener("input",e=>{NOTE_FILTER.q=e.target.value;upd()});$("#nd").addEventListener("change",e=>{NOTE_FILTER.days=e.target.value;upd()})};

VIEWS.clients=()=>`<div class="card"><div class="spread" style="margin-bottom:14px"><span class="note">${S.clients.length} clientes · procuração eletrônica no Emissor Nacional</span><button class="btn primary" data-act="newClient" ${can.manage()?"":"disabled"}>Adicionar cliente</button></div>
 <div class="tablewrap"><table><thead><tr><th>Cliente</th><th>CNPJ</th><th>Procuração</th><th>Aprovação</th><th class="num">Notas no mês</th><th></th></tr></thead><tbody>${S.clients.map(c=>{const dl=c.procExp?Math.round((c.procExp-NOW)/864e5):null;const b=c.proc==="Pendente"?'<span class="badge b-warn">Pendente</span>':dl<=30?`<span class="badge b-warn">Vence em ${dl} dias</span>`:`<span class="badge b-ok">Ativa até ${fDate(c.procExp)}</span>`;
 return `<tr><td><b>${esc(c.name)}</b><div class="note">${esc(c.email)}</div></td><td>${fmtDoc(c.cnpj)}</td><td>${b}</td><td><select data-clmode="${c.id}" style="width:auto" aria-label="Modo de aprovação de ${esc(c.name)}" ${can.manage()?"":"disabled"}><option ${c.mode==="Manual"?"selected":""}>Manual</option><option ${c.mode==="Automática"?"selected":""}>Automática</option></select></td><td class="num">${c.monthNotes}</td><td><button class="btn sm" data-act="validateProc" data-id="${c.id}" ${can.manage()?"":"disabled"}>Validar procuração</button></td></tr>`}).join("")}</tbody></table></div>
 <p class="note mt">Modo “Automática”: após o período de acompanhamento (30, 60 ou 90 dias, definido em Configurações), as notas desse cliente passam a ser emitidas sem aprovação manual.</p></div>`;

VIEWS.health=()=>{const days=S.certDays,cu=window.monthUsd?monthUsd():S.claudeUsd,cl=S.cfg.claudeLimit;
  return `<div class="grid g2"><div class="card"><div class="spread"><h2>Conexões</h2><button class="btn sm" data-act="testConn">Testar conexões</button></div><div id="svcs">${svcList()}</div></div>
  <div class="grid"><div class="card"><h2>Certificado digital A1</h2><div class="spread"><span class="badge ${days<=S.cfg.certWarn?"b-warn":"b-ok"}">Vence em ${days} dias</span><span class="note">${fDate(addDays(NOW,days))}</span></div><div class="prog mt ${days<=30?"err":days<=S.cfg.certWarn?"warn":""}"><i style="width:${Math.min(100,days/365*100)}%"></i></div><p class="note">Avisos começam ${S.cfg.certWarn} dias antes do vencimento. Renove com antecedência para não interromper as emissões.</p><button class="btn sm" data-act="certRenew" ${can.manage()?"":"disabled"}>Simular renovação do certificado</button></div>
  <div class="card"><h2>Consumo do Claude (mês)</h2><div class="spread"><b>US$ ${cu.toFixed(2).replace(".",",")}</b><span class="note">limite configurado US$ ${cl}</span></div><div class="prog mt ${cu/cl>.8?"err":cu/cl>.6?"warn":""}"><i style="width:${Math.min(100,cu/cl*100)}%"></i></div><p class="note">Custo estimado pela chave da própria Cruz (${S.notes.filter(n=>n.date.getMonth()===NOW.getMonth()).length} notas no mês).</p></div></div></div>
  <div class="card mt"><h2>Computador dedicado</h2><div class="grid g3"><div><div class="spread"><span>SSD 480 GB</span><b>31%</b></div><div class="prog"><i style="width:31%"></i></div></div><div><div class="spread"><span>HD USB de backup (1 TB)</span><b>12%</b></div><div class="prog"><i style="width:12%"></i></div></div><div><div class="spread"><span>Memória (16 GB)</span><b>38%</b></div><div class="prog"><i style="width:38%"></i></div></div></div>
  <div class="spread mt"><div><span class="dot" id="upsDot"></span><b id="upsTxt">Nobreak APC online · bateria 100%</b><div class="note">Cabo USB configurado: em queda de energia prolongada o sistema salva tudo e desliga com segurança.</div></div><button class="btn sm" data-act="upsTest">Simular queda de energia</button></div></div>`};
const SVC=[["Emissor Nacional (produção restrita)","Resposta em 420 ms"],["E-mail de entrada de pedidos","contabilidade@… conectada"],["OneDrive (pasta CLIENTES)","Gravação autorizada na pasta de teste"],["Serviço de emissão (computador local)","Ativo há 12 dias"],["Servidor de licenças (GitHub)","Última verificação há 2 h"],["API do Claude","Chave válida"]];
const svcList=(st)=>SVC.map(([n,d],i)=>`<div class="svc"><div><span class="dot ${st&&st[i]==="load"?"load":""}"></span><b>${n}</b><small>${st&&st[i]==="load"?"Testando…":d}</small></div><span class="badge ${st&&st[i]==="load"?"b-info":"b-ok"}">${st&&st[i]==="load"?"Testando":"Online"}</span></div>`).join("");

VIEWS.license=()=>{const L=S.lic,left=Math.round((L.expiry-NOW)/864e5),act=S.users.filter(u=>u.active).length,pct=act/L.limit*100;
  const st=left<0?["b-err","Vencida"]:left<=30?["b-warn",`Vence em ${left} dias`]:["b-ok","Ativa"];
  return `<div class="grid g2"><div class="card"><div class="spread"><h2>Licença de uso</h2><span class="badge ${st[0]}">${st[1]}</span></div>
  <dl class="kv"><dt>Plano</dt><dd>${esc(L.plan)} (limite de ${L.limit})</dd><dt>Início</dt><dd>${fDate(L.start)}</dd><dt>Validade</dt><dd>${fDate(L.expiry)} (${left} dias)</dd><dt>Atualizações até</dt><dd>${fDate(L.updatesUntil)}</dd><dt>Versão instalada</dt><dd>${L.version}</dd><dt>ID da instalação</dt><dd><span class="mono">${L.installId}</span></dd><dt>Assinatura da licença</dt><dd>Válida</dd><dt>Última verificação</dt><dd>${ago((new Date()-L.lastCheck)/60000)}</dd></dl>
  <p class="note mt">${L.included?"O 1º ano de licença está incluso no projeto.":""} Se o computador ficar sem internet, o sistema continua funcionando por até 15 dias. Com a licença vencida, só ficam bloqueados novos usuários e alterações; as notas já emitidas e os arquivos continuam acessíveis.</p>
  <div class="row"><button class="btn" data-act="checkLic">Verificar licença agora</button><button class="btn primary" data-act="renew" ${can.admin()||can.manage()?"":"disabled"}>Renovar licença</button><button class="btn" data-act="addSeats" ${can.admin()||can.manage()?"":"disabled"}>Adicionar usuários</button></div></div>
  <div class="card"><h2>Usuários da licença</h2><div class="spread"><span><b>${act}</b> de <b>${L.limit}</b> em uso</span><span class="note">máximo contratável: 15</span></div><div class="prog mt ${pct>=100?"err":pct>=80?"warn":""}"><i style="width:${Math.min(100,pct)}%"></i></div>
  <p class="note">A licença informa ao desenvolvedor somente a quantidade de usuários, nunca nomes, clientes ou notas (LGPD).</p>
  <h3 class="mt">Tabela de valores (referência)</h3><table><tbody><tr><td>Licença anual (1 a 5 usuários)</td><td class="num">${brl(550)}</td></tr><tr><td>Licença bianual (1 a 5 usuários)</td><td class="num">${brl(985)}</td></tr><tr><td>Usuário adicional (6 a 15), por ano</td><td class="num">${brl(77)}</td></tr><tr><td>Pagamento mensal opcional</td><td class="num">${brl(45.83)}</td></tr></tbody></table></div></div>
  <div class="card mt"><h2>Pedidos de licença</h2>${S.requests.length?`<div class="tablewrap"><table><thead><tr><th>Pedido</th><th>Descrição</th><th class="num">Valor</th><th>Situação</th></tr></thead><tbody>${S.requests.map(r=>`<tr><td>${fDT(r.t)}</td><td>${esc(r.desc)}</td><td class="num">${brl(r.value)}</td><td><span class="badge ${r.status==="Licença emitida"?"b-ok":"b-warn"}">${r.status}</span></td></tr>`).join("")}</tbody></table></div>`:'<p class="note">Nenhum pedido ainda. Ao solicitar, o desenvolvedor confirma o pagamento e publica a nova licença assinada; o sistema atualiza sozinho.</p>'}
  ${S.requests.some(r=>r.status!=="Licença emitida")?`<div class="callout mt"><b>Lado do desenvolvedor (simulação)</b><p class="note">Na vida real, quem confirma o pagamento e assina a licença é o desenvolvedor, fora deste painel. Aqui você pode ver como isso chega ao sistema.</p><button class="btn sm" data-act="devConfirm">Confirmar pagamento e publicar licença</button></div>`:""}</div>`};

VIEWS.users=()=>{const act=S.users.filter(u=>u.active).length;return `<div class="card"><div class="spread" style="margin-bottom:14px"><span class="note"><b>${act}</b> usuários ativos de <b>${S.lic.limit}</b> licenciados</span><button class="btn primary" data-act="newUser">Liberar novo usuário</button></div>
 <div class="tablewrap"><table><thead><tr><th>Usuário</th><th>Perfil</th><th>MFA</th><th>Último acesso</th><th>Situação</th><th></th></tr></thead><tbody>${S.users.map(u=>`<tr><td><b>${esc(u.name)}</b><div class="note">${esc(u.email)}</div></td><td>${esc(u.role)}</td><td>${u.mfa?'<span class="badge b-ok">Ativo</span>':'<span class="badge b-warn">Pendente</span>'}</td><td>${esc(u.last)}</td><td>${u.active?'<span class="badge b-ok">Ativo</span>':'<span class="badge b-mute">Bloqueado</span>'}</td>
 <td><div class="row"><button class="btn sm" data-act="editUser" data-id="${u.id}">Editar</button><button class="btn sm" data-act="resetMfa" data-id="${u.id}">Redefinir MFA</button><button class="btn sm" data-act="resetPwd" data-id="${u.id}">Trocar senha</button><button class="btn sm ${u.active?"danger":""}" data-act="toggleUser" data-id="${u.id}">${u.active?"Bloquear":"Liberar"}</button></div></td></tr>`).join("")}</tbody></table></div>
 <div class="callout mt">Ao sair um funcionário, bloqueie o acesso aqui: o login e o MFA dele deixam de valer na hora e o usuário libera uma vaga da licença.</div></div>`};

VIEWS.backups=()=>{const b=S.bk;return `<div class="grid g2"><div class="card"><h2>Agendamento e retenção</h2>
 <div class="form2"><div class="field"><label for="bkt">Horário</label><input type="time" id="bkt" value="${b.time}"></div><div class="field"><label for="bkf">Frequência</label><select id="bkf">${["Diário","Semanal","A cada 12 horas"].map(x=>`<option ${b.freq===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label for="bkr">Retenção (dias)</label><input type="number" id="bkr" min="7" max="365" value="${b.retention}"></div><div class="field"><label>Arquivos incluídos</label><div class="row">${Object.keys(b.types).map(t=>`<label style="margin:0;font-weight:500"><input type="checkbox" data-bkt="${t}" ${b.types[t]?"checked":""}> ${t}</label>`).join("")}</div></div></div>
 <div class="opt"><div><b>HD USB (local)</b><small>Cópia diária no HD de 1 TB conectado ao computador.</small></div><label class="switch"><input type="checkbox" id="bkusb" ${b.usb?"checked":""}><span></span></label></div>
 <div class="opt"><div><b>Nuvem criptografada (opcional, sob consulta)</b><small>Contratada à parte, por volume fixo e ampliável. <span id="cloudGB">${b.cloudGB} GB</span></small></div><label class="switch"><input type="checkbox" id="bkcloud" ${b.cloud?"checked":""}><span></span></label></div>
 <div class="field mt"><label for="bkrec">Enviar o relatório de cada backup para</label><input type="text" id="bkrec" value="${esc(b.recipients)}"></div>
 <div class="opt"><div><b>Incluir o log do backup em nuvem no e-mail</b></div><label class="switch"><input type="checkbox" id="bkml" ${b.mailCloudLog?"checked":""}><span></span></label></div>
 <div class="row mt"><button class="btn primary" data-act="saveBk" ${can.admin()?"":"disabled"}>Salvar</button><button class="btn" data-act="runBk" ${can.admin()?"":"disabled"}>Executar backup agora</button><button class="btn" data-act="mailBk">Enviar relatório por e-mail</button><button class="btn" data-act="restoreTest" ${can.admin()?"":"disabled"}>Testar restauração</button></div><div id="bkprog" class="mt hide"><div class="prog"><i style="width:0"></i></div><p class="note" id="bkmsg"></p></div></div>
 <div class="card"><h2>Histórico de backups</h2><div class="tablewrap"><table><thead><tr><th>Data</th><th>Destino</th><th class="num">Arquivos</th><th class="num">Tamanho</th><th>Resultado</th></tr></thead><tbody id="bklog">${bkRows()}</tbody></table></div></div></div>`};
const bkRows=()=>S.bk.logs.map(l=>`<tr><td>${fDT(l.d)}</td><td>${l.dest}</td><td class="num">${l.files}</td><td class="num">${l.size}</td><td>${l.ok?'<span class="badge b-ok">Concluído</span>':`<span class="badge b-err">Falhou: ${esc(l.err)}</span>`}</td></tr>`).join("");

VIEWS.settings=()=>{const c=S.cfg;const sw=(id,t,s,on)=>`<div class="opt"><div><b>${t}</b><small>${s}</small></div><label class="switch"><input type="checkbox" id="${id}" ${on?"checked":""}><span></span></label></div>`;
 return `<div class="grid g2"><div class="card"><h2>Aprovação das notas</h2><div class="field"><label for="cMode">Modo padrão</label><select id="cMode"><option ${c.mode==="Manual"?"selected":""}>Manual</option><option ${c.mode==="Automática"?"selected":""}>Automática</option></select></div>
  <div class="field"><label for="cAuto">Passar para automático após (dias de acompanhamento)</label><select id="cAuto">${["30","60","90"].map(x=>`<option ${c.autoAfter===x?"selected":""}>${x}</option>`).join("")}</select></div>
  <div class="field"><label for="cLimit">Valor acima do qual exige aprovação do gerente (R$)</label><input type="text" id="cLimit" value="${c.limit.toLocaleString("pt-BR",{minimumFractionDigits:2})}"></div></div>
 <div class="card"><h2>Entrada e saída de arquivos</h2><div class="field"><label for="cInbox">Caixa de e-mail que recebe os pedidos</label><input type="email" id="cInbox" value="${esc(c.inbox)}"></div><div class="field"><label for="cFolder">Pasta de gravação (PDF e XML)</label><input type="text" id="cFolder" value="${esc(c.folder)}"></div><p class="note">O sistema grava só nas pastas autorizadas, sem acesso ao restante do OneDrive.</p></div>
 <div class="card"><h2>Alertas</h2>${sw("aCert","Certificado A1 perto de vencer","Avisa antes do vencimento",c.alertCert)}<div class="field mt"><label for="cWarn">Avisar com quantos dias de antecedência</label><input type="number" id="cWarn" min="7" max="120" value="${c.certWarn}"></div>${sw("aStuck","Pedido parado aguardando aprovação","Avisa quando passa do tempo definido",c.alertStuck)}<div class="field mt"><label for="cWait">Tempo máximo parado (horas)</label><input type="number" id="cWait" min="1" max="48" value="${c.waitHours}"></div>${sw("aBk","Falha de backup","Avisa por e-mail e no painel",c.alertBackup)}${sw("aCl","Consumo do Claude perto do limite (70% e 90%)","Evita surpresa na fatura",c.alertClaude)}
  <div class="field mt"><label for="cNot">Enviar alertas para</label><input type="text" id="cNot" value="${esc(c.notifyTo)}"></div></div>

const SAMPLE_OK=`De: financeiro@construtoraexemplo.example\nAssunto: Emitir NFS-e\n\nOlá, por favor emitir uma nota de serviço para Empresa Modelo S.A., CNPJ 11.222.333/0001-81, no valor de R$ 8.500,00, referente a consultoria em engenharia civil prestada em novembro de 2026.\nObrigado!`;
const SAMPLE_BAD=`De: contato@studioalfa.example\nAssunto: Nota fiscal\n\nBoa tarde, preciso de uma nota para João da Silva, CPF 123.456.789-00, no valor de R$ 1.250,00, referente a criação de logotipo.`;
function extract(text){const email=(text.match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/)||[""])[0];const client=S.clients.find(c=>c.email===email||(email&&c.email.split("@")[1]===email.split("@")[1]));
  const doc=(text.match(/\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}|\d{3}\.?\d{3}\.?\d{3}-?\d{2}/)||[""])[0];const val=(text.match(/R\$\s*([\d.]+,\d{2}|\d+)/)||[])[1];
  const tk=(text.match(/(?:para|tomador:?)\s+([^,\n]+?)(?:,|\n|\s+CNPJ|\s+CPF)/i)||[])[1]||"";const desc=(text.match(/referente\s+(?:a|à|ao)\s+([^.\n]+)/i)||[])[1]||"";
  return {client:client?client.name:"",taker:tk.trim(),doc:doc,value:val?parseMoney(val):0,desc:desc.trim()}}
function newOrderModal(){modal("Simular pedido recebido por e-mail",`<p class="note">Cole o texto de um e-mail de cliente. O Claude (simulado) identifica o prestador, o tomador, o documento, o valor e a descrição, e o sistema valida os dados.</p>
 <div class="row" style="margin-bottom:8px"><button class="btn sm" data-ex="ok">Usar exemplo válido</button><button class="btn sm" data-ex="bad">Usar exemplo com CPF inválido</button></div>
 <div class="field"><label for="mail">Texto do e-mail</label><textarea id="mail">${esc(SAMPLE_OK)}</textarea></div><div id="exRes"></div>`,
 [{label:"Cancelar"},{label:"Interpretar com o Claude",cls:"",stay:true,fn:()=>{doExtract();return false}},{label:"Criar pedido",cls:"primary",fn:()=>{const x=window.__ex||extract($("#mail").value);if(!x.client){$("#exRes").innerHTML='<div class="callout warn">Não encontrei o cliente pelo remetente. Use um dos exemplos ou um e-mail de cliente cadastrado.</div>';return false}
  const o={id:S.nextOrder++,created:new Date(),client:x.client,taker:x.taker||"Tomador não identificado",doc:x.doc,value:x.value,desc:x.desc||"Serviço informado no e-mail",status:"aguardando",error:""};const e=validate(o);if(e){o.status="erro";o.error=e}
  S.orders.unshift(o);audit(`Recebeu o pedido #${o.id} por e-mail (${o.client})`);notify(e?`Pedido #${o.id} chegou com inconsistência: ${e}.`:`Novo pedido #${o.id} aguardando aprovação (${o.client}).`,e?"err":"warn");toast(e?`Pedido #${o.id} criado com inconsistência.`:`Pedido #${o.id} criado e enviado para aprovação.`,e?"warn":"ok");window.__ex=null;refresh()}}]);
 $$("[data-ex]").forEach(b=>b.addEventListener("click",()=>{$("#mail").value=b.dataset.ex==="ok"?SAMPLE_OK:SAMPLE_BAD;doExtract()}));window.__ex=null}
function doExtract(){const x=extract($("#mail").value);window.__ex=x;const e=x.client?validate({...x}):"Cliente não identificado";
  $("#exRes").innerHTML=`<div class="card" style="padding:14px"><b>Dados identificados</b><dl class="kv mt"><dt>Prestador (cliente da Cruz)</dt><dd>${esc(x.client||"não identificado")}</dd><dt>Tomador</dt><dd>${esc(x.taker||"-")}</dd><dt>CPF/CNPJ</dt><dd>${esc(x.doc?fmtDoc(x.doc):"-")}</dd><dt>Valor</dt><dd>${x.value?brl(x.value):"-"}</dd><dt>Descrição</dt><dd>${esc(x.desc||"-")}</dd></dl><p class="mt">${e?`<span class="badge b-err">${esc(e)}</span> O pedido seguirá para a fila de correção.`:'<span class="badge b-ok">Dados conferidos</span> O pedido irá para aprovação.'}</p></div>`}
function readCard(id){const el=$(`[data-card="${id}"]`),o=S.orders.find(x=>x.id==id);$$("[data-f]",el).forEach(i=>{const f=i.dataset.f;o[f]=f==="value"?parseMoney(i.value):i.value.trim()});return o}
function seatsModal(){const L=S.lic;modal("Adicionar usuários",`<p class="note">Usuários adicionais custam ${brl(77)} por ano, proporcional ao período restante da licença (${Math.max(0,Math.round((L.expiry-NOW)/864e5))} dias). Máximo de 15 usuários.</p><div class="field"><label for="sq">Quantidade de usuários adicionais</label><input type="number" id="sq" min="1" max="${15-L.limit}" value="1"></div><div class="callout" id="sv"></div>`,[{label:"Cancelar"},{label:"Solicitar",cls:"primary",fn:()=>{const q=Math.min(15-L.limit,Math.max(1,parseInt($("#sq").value)||1));if(L.limit>=15){toast("Limite máximo de 15 usuários atingido.","err");return}const v=77*q*Math.max(0,(L.expiry-NOW)/864e5)/365;S.requests.unshift({t:new Date(),desc:`+${q} usuário(s) adicional(is)`,value:Math.round(v*100)/100,status:"Aguardando pagamento",kind:"seats",q});audit(`Solicitou ${q} usuário(s) adicional(is) de licença`);toast("Pedido enviado ao desenvolvedor (simulado). Aguardando confirmação do pagamento.","ok");refresh()}}]);
  const upd=()=>{const q=Math.max(0,parseInt($("#sq").value)||0);$("#sv").innerHTML=`Valor estimado: <b>${brl(77*q*Math.max(0,(L.expiry-NOW)/864e5)/365)}</b> (${q} × ${brl(77)}/ano, proporcional)`};$("#sq").addEventListener("input",upd);upd()}
function renewModal(){modal("Renovar licença",`<div class="field"><label for="rp">Período</label><select id="rp"><option value="1">Anual: ${brl(550)}</option><option value="2">Bianual: ${brl(985)} (cerca de 10,5% de desconto)</option></select></div><div class="field"><label for="rx">Usuários adicionais (além dos 5)</label><input type="number" id="rx" min="0" max="10" value="0"></div><div class="callout" id="rv"></div>`,
 [{label:"Cancelar"},{label:"Solicitar renovação",cls:"primary",fn:()=>{const y=+$("#rp").value,x=Math.min(10,Math.max(0,parseInt($("#rx").value)||0)),v=(y===1?550:985)+77*x*y;S.requests.unshift({t:new Date(),desc:`Renovação ${y===1?"anual":"bianual"}${x?` com ${x} usuário(s) adicional(is)`:""}`,value:v,status:"Aguardando pagamento",kind:"renew",y,x});audit("Solicitou renovação de licença");toast("Pedido de renovação enviado (simulado). Aguardando confirmação do pagamento.","ok");refresh()}}]);
 const upd=()=>{const y=+$("#rp").value,x=Math.min(10,Math.max(0,parseInt($("#rx").value)||0));$("#rv").innerHTML=`Total: <b>${brl((y===1?550:985)+77*x*y)}</b>`};$("#rp").addEventListener("change",upd);$("#rx").addEventListener("input",upd);upd()}
function userModal(u){const edit=!!u;modal(edit?"Editar usuário":"Liberar novo usuário",`<div class="form2"><div class="field"><label for="un">Nome</label><input type="text" id="un" value="${esc(u?u.name:"")}"></div><div class="field"><label for="ue">E-mail</label><input type="email" id="ue" value="${esc(u?u.email:"")}"></div><div class="field full"><label for="ur">Perfil</label><select id="ur">${["Visualizador","Aprovador","Gerente","Administrador"].map(r=>`<option ${u&&u.role===r?"selected":""}>${r}</option>`).join("")}</select></div></div><p class="note">Visualizador: só consulta. Aprovador: aprova e devolve pedidos. Gerente: também gerencia clientes e licenciamento. Administrador: tudo, incluindo usuários, backups e configurações.</p>`,
 [{label:"Cancelar"},{label:edit?"Salvar":"Liberar acesso",cls:"primary",fn:()=>{const n=$("#un").value.trim(),e=$("#ue").value.trim(),r=$("#ur").value;if(!n||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){toast("Informe um nome e um e-mail válido.","err");return false}
  if(edit){u.name=n;u.email=e;u.role=r;audit(`Alterou o usuário ${n}`);toast("Usuário atualizado.","ok")}else{if(S.users.filter(x=>x.active).length>=S.lic.limit){toast(`Todas as ${S.lic.limit} vagas estão em uso. Bloqueie um usuário ou solicite usuários adicionais em Licenciamento.`,"warn");return false}
   S.users.push({id:S.nextUser++,name:n,email:e,role:r,active:true,mfa:false,last:"nunca"});audit(`Liberou o acesso de ${n} (${r})`);toast(`Acesso liberado para ${n}. O MFA será configurado no primeiro login.`,"ok")}refresh()}}])}

  if(t.dataset.note){const n=S.notes.find(x=>x.n==t.dataset.note);const xml=`<?xml version="1.0" encoding="UTF-8"?>\n<!-- ARQUIVO DE EXEMPLO. Dados simulados, sem valor fiscal. -->\n<NFSe><numero>${n.n}</numero><emissao>${n.date.toISOString()}</emissao><prestador>${esc(n.client)}</prestador><tomador>${esc(n.taker)}</tomador><valor>${n.value.toFixed(2)}</valor></NFSe>`;

  const a=t.dataset.act,id=+t.dataset.id;
  const A={
   readAll(){S.notifs.forEach(n=>n.read=true);renderBell()},
   newOrder:newOrderModal,
   approve(){if(!can.approve())return toast("Seu perfil não pode aprovar.","err");const o=readCard(id);if(approve(id)){toast(`Pedido #${id} aprovado. Emitindo no portal…`);refresh()}else refresh()},
   saveOrder(){const o=readCard(id);toast("Edição salva.","ok");refresh()},

   approveAll(){let n=0;S.orders.filter(o=>o.status==="aguardando").forEach(o=>{if(!validate(o)){approve(o.id);n++}});toast(n?`${n} pedido(s) aprovado(s). Emitindo…`:"Nenhum pedido válido para aprovar.",n?"ok":"warn");refresh()},
   fixOrder(){const o=readCard(id),e=validate(o);if(e){o.error=e;toast(`Ainda há uma inconsistência: ${e}.`,"err");return refresh()}o.status="aguardando";o.error="";audit(`Corrigiu o pedido #${id}`);toast("Pedido corrigido e enviado para aprovação.","ok");refresh()},

   exportCsv(){const r=noteRows();download("notas-emitidas-simuladas.csv","﻿Numero;Data;Prestador;Tomador;Valor\n"+r.list.map(n=>[n.n,fDT(n.date),n.client,n.taker,n.value.toFixed(2).replace(".",",")].join(";")).join("\n"),"text/csv");toast("CSV gerado com dados simulados.","ok")},

   upsTest(){const d=$("#upsDot"),tx=$("#upsTxt");d.className="dot warn";tx.textContent="Queda de energia · rodando na bateria (92%)";notify("Queda de energia no computador do sistema. Rodando na bateria.","warn");toast("Simulação: nobreak em bateria. Se não voltar, o desligamento seguro será iniciado.","warn");setTimeout(()=>{const x=$("#upsDot");if(x){x.className="dot";$("#upsTxt").textContent="Energia restabelecida · nobreak online · bateria 100%";toast("Energia voltou. Nada foi interrompido.","ok")}},4500)},

  const lockTxt=LG.lock>Date.now()?`<div class="callout warn" id="lockmsg">Muitas tentativas. Aguarde <span id="lk">${Math.ceil((LG.lock-Date.now())/1000)}</span> s para tentar de novo.</div>`:"";
  let body="";
  if(LG.step==="cred")body=`<form id="lf" novalidate><div class="field"><label for="lu">E-mail</label><input type="email" id="lu" value="${esc(LG.email)}" autocomplete="username"></div>${pwField("lp","Senha",false,'value="demonstracao"')}<div id="lerr" class="errmsg" role="alert"></div><div class="spread" style="margin:8px 0 14px"><label style="margin:0;font-weight:500"><input type="checkbox" id="lr"> Lembrar este computador por 30 dias</label><button type="button" class="linkbtn" style="color:var(--primary)" data-do="forgot">Esqueci a senha</button></div><button class="btn primary" style="width:100%" id="lgo">Entrar</button></form><div class="loginhint"><b>Usuários da demonstração</b> (qualquer senha com 8 ou mais caracteres):<br>sena@cruz.example · Gerente<br>marina@cruz.example · Aprovador<br>ti@cruz.example · Administrador<br>ana@cruz.example · bloqueada (teste o aviso)<br>rafael@cruz.example · bloqueado</div>`;
  if(LG.step==="mfa")body=`<form id="lf" novalidate><p><b>Verificação em duas etapas</b><br><span class="note">Digite o código de 6 dígitos do aplicativo autenticador de ${esc(LG.user.name)}.</span></p><div class="field"><label for="lc">Código</label><input type="text" id="lc" class="codein" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"></div><div id="lerr" class="errmsg" role="alert"></div><button class="btn primary" style="width:100%;margin-top:10px">Confirmar</button><div class="row" style="justify-content:space-between;margin-top:10px"><button type="button" class="linkbtn" style="color:var(--primary)" data-do="lgRecovery">Usar código de recuperação</button><button type="button" class="linkbtn" style="color:var(--primary)" data-do="lgBack">Voltar</button></div></form>${authBox()}`;
  if(LG.step==="setup")body=`<form id="lf" novalidate><p><b>Configurar o MFA (primeiro acesso)</b><br><span class="note">1) Abra o aplicativo autenticador. 2) Leia o QR code ou digite a chave. 3) Digite o código gerado.</span></p><div class="row" style="align-items:flex-start">${qrSvg(LG.user.id*977+13)}<div style="flex:1;min-width:160px"><label>Chave manual</label><span class="mono">JBSW Y3DP EHPK 3PXP</span><p class="hint">QR e chave são de demonstração e não funcionam em aplicativos reais.</p></div></div><div class="field mt"><label for="lc">Código mostrado no aplicativo</label><input type="text" id="lc" class="codein" inputmode="numeric" maxlength="6" placeholder="000000"></div><div id="lerr" class="errmsg" role="alert"></div><button class="btn primary" style="width:100%;margin-top:10px">Ativar MFA e entrar</button><div style="text-align:center;margin-top:10px"><button type="button" class="linkbtn" style="color:var(--primary)" data-do="lgBack">Voltar</button></div></form>${authBox()}`;
  if(LG.step==="recovery")body=`<form id="lf" novalidate><p><b>Código de recuperação</b><br><span class="note">Use um dos códigos gerados quando o aplicativo não está disponível. Cada código vale uma vez.</span></p><div class="field"><label for="lc">Código de recuperação</label><input type="text" id="lc" placeholder="RECUP-XXXX-XXXX"></div><p class="hint">Na demonstração use: <span class="mono">RECUP-DEMO-2026</span></p><div id="lerr" class="errmsg" role="alert"></div><button class="btn primary" style="width:100%">Entrar</button><div style="text-align:center;margin-top:10px"><button type="button" class="linkbtn" style="color:var(--primary)" data-do="lgBack">Voltar</button></div></form>`;
  L.innerHTML=`<div class="box">${head}${lockTxt}${body}<div class="callout mt">Todos os dados são <b>fictícios</b>. Nada é real.</div></div>`;
  const f=$("#lf");f.addEventListener("submit",loginSubmit);const first=$("input:not([type=checkbox])",f);first&&first.focus();
  clearInterval(authTimer);authTimer=setInterval(()=>{const c=$("#acode");if(c){c.textContent=totp().replace(/(\d{3})(\d{3})/,"$1 $2");$("#aleft").textContent=totpLeft();$("#abar").style.width=totpLeft()/30*100+"%"}const lk=$("#lk");if(lk){const s=Math.ceil((LG.lock-Date.now())/1000);if(s<=0)drawLogin();else lk.textContent=s}},1000)}
function loginFail(msg){LG.fails++;const e=$("#lerr");if(LG.fails>=S.sec.maxFails||LG.fails>=3){LG.fails=0;LG.lock=Date.now()+20000;drawLogin();return}e.textContent=msg+` (tentativa ${LG.fails} de 3)`}
function loginSubmit(ev){ev.preventDefault();if(LG.lock>Date.now()){return}const err=$("#lerr");err.textContent="";
  if(LG.step==="cred"){const em=$("#lu").value.trim().toLowerCase(),pw=$("#lp").value;LG.email=em;
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){err.textContent="Digite um e-mail válido.";return}
    if(pw.length<8){err.textContent="A senha deve ter no mínimo 8 caracteres.";return}
    const u=S.users.find(x=>x.email.toLowerCase()===em);if(!u){loginFail("E-mail ou senha incorretos.");return}
    if(!u.active){err.textContent="Acesso bloqueado. Peça ao administrador para liberar o seu usuário.";return}
    LG.user=u;LG.step=(!u.mfa)?"setup":"mfa";LG.fails=0;drawLogin();return}
  const code=$("#lc").value.replace(/\s/g,"");
  if(LG.step==="recovery"){if(code.toUpperCase()==="RECUP-DEMO-2026"){enterApp(LG.user)}else loginFail("Código de recuperação inválido.");return}
  if(!/^\d{6}$/.test(code)){err.textContent="O código tem 6 números.";return}
  if(code===totp()||code===totp(-1)){if(LG.step==="setup"){LG.user.mfa=true;audit(`${LG.user.name} ativou o MFA no primeiro acesso`)}enterApp(LG.user)}else loginFail("Código incorreto ou expirado.")}
function enterApp(u){ME=u.id;ROLE=u.role;u.last="agora";$("#roleSel").value=ROLE;$("#whoName").textContent=u.name.split(" ")[0];$("#whoRole").textContent=ROLES[ROLE];
  clearInterval(authTimer);$("#login").classList.add("hide");$("#app").hidden=false;LG.step="cred";LG.user=null;
  VIEW=(location.hash||"#overview").slice(1);if(!VIEWS[VIEW])VIEW="overview";renderNav();renderBell();paint();audit("Entrou no painel (senha + MFA)");toast(`Bem-vindo(a), ${u.name.split(" ")[0]}. Este é um painel de demonstração.`,"ok");
  const o=S.orders.find(x=>x.status==="emitindo");o&&setTimeout(()=>finalize(o.id),6000)}

  if(!$(".sidefoot .btn")){const b=document.createElement("button");b.className="btn";b.dataset.do="logout";b.textContent="Sair";$(".sidefoot").appendChild(b);const n=$("#whoName");n.outerHTML=`<button class="me" data-do="goAccount"><b id="whoName">${esc(n.textContent)}</b></button>`}};

 <div class="card"><h2>Autenticação em duas etapas (MFA)</h2><p><span class="badge ${u.mfa?"b-ok":"b-warn"}">${u.mfa?"Ativa":"Pendente"}</span></p><p class="note">Além da senha, o login pede um código de 6 dígitos do aplicativo autenticador. ${S.sec.mfaReq?"O administrador tornou o MFA obrigatório.":""}</p><div class="row"><button class="btn" data-do="accMfa">Reconfigurar MFA</button><button class="btn" data-do="accRecov">Gerar códigos de recuperação</button></div>

function emailModal(e){const ed=!!e;e=e||{addr:"",role:"Entrada de pedidos",prov:"Microsoft 365 (OAuth)",auth:"OAuth",folder:"Caixa de Entrada/Pedidos NFS-e",senders:"Somente e-mails dos clientes cadastrados",sig:"",auto:"",on:true};

  [{label:"Cancelar"},{label:"Salvar conta",cls:"primary",fn:()=>{const a=val("em_a").trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(a)){toast("Informe um e-mail válido.","err");return false}
   if(val("em_t")==="Senha de aplicativo"&&(!ed||val("em_pw"))){const m=pwMsg(val("em_pw"));if(m){toast(m,"err");return false}}
   const o=ed?e:{id:Date.now(),on:true,status:"ok",last:new Date(),today:0};Object.assign(o,{addr:a,role:val("em_r"),prov:val("em_p"),auth:val("em_t"),folder:val("em_f"),senders:val("em_s"),sig:val("em_g"),auto:val("em_u")});if(!ed)S.emails.push(o);audit(`${ed?"Alterou":"Adicionou"} a conta de e-mail ${a}`);toast("Conta salva.","ok");paint()}}])}
VIEWS.email=()=>{const r=S.emRules;return `<div class="spread" style="margin-bottom:14px"><span class="note">${S.emails.length} contas · o sistema lê pedidos, envia as notas e manda alertas por elas</span><button class="btn primary" data-do="emailAdd">Adicionar conta</button></div>
 <div class="grid g2">${S.emails.map(e=>`<div class="card"><div class="spread"><b>${esc(e.addr)}</b><span class="badge ${e.status==="ok"?"b-ok":"b-warn"}">${e.status==="ok"?"Conectada":"Atenção"}</span></div><p class="note" style="margin:4px 0 10px">${esc(e.role)}</p><dl class="kv"><dt>Provedor</dt><dd>${esc(e.prov)}</dd><dt>Autenticação</dt><dd>${esc(e.auth)}</dd>${e.folder?`<dt>Pasta monitorada</dt><dd>${esc(e.folder)}</dd>`:""}<dt>Última atividade</dt><dd>${ago((new Date()-e.last)/60000)}</dd><dt>Hoje</dt><dd>${e.today} mensagens</dd></dl>${e.status!=="ok"?'<div class="callout warn mt">A última verificação falhou. Teste a conexão ou confira a senha de aplicativo.</div>':""}<div class="row mt"><button class="btn sm" data-do="emailTest" data-id="${e.id}">Testar conexão</button><button class="btn sm" data-do="emailEdit" data-id="${e.id}">Editar</button><button class="btn sm danger" data-do="emailDel" data-id="${e.id}">Remover</button></div></div>`).join("")}</div>
 <div class="card mt"><h2>Regras de entrada</h2><div class="form2"><div class="field"><label for="rMB">Tamanho máximo de anexo (MB)</label><input type="number" id="rMB" min="1" max="50" value="${r.maxMB}"></div><div class="field"><label for="rFwd">Encaminhar e-mails não reconhecidos para</label><input type="email" id="rFwd" value="${esc(r.fwd)}"></div></div>${tog("rKnown","Aceitar pedidos só de clientes cadastrados","Remetentes desconhecidos vão para a pasta de revisão",r.onlyKnown)}${tog("rConf","Confirmar o recebimento por e-mail","Envia a resposta automática da conta de entrada",r.confirm)}<div class="row mt"><button class="btn primary" data-do="emailRules">Salvar regras</button></div></div>`};

/* --- Claude (API) --- */
VIEWS.claude=()=>{const a=S.api,mu=monthUsd(),mc=S.apiDaily.filter(x=>x.date.getMonth()===NOW.getMonth()),calls=mc.reduce((s,x)=>s+x.calls,0),tin=mc.reduce((s,x)=>s+x.tin,0),tout=mc.reduce((s,x)=>s+x.tout,0),mx=Math.max(...S.apiDaily.map(x=>x.usd),.1),today=S.apiDaily[S.apiDaily.length-1];
  const notesM=Math.max(1,S.notes.filter(n=>n.date.getMonth()===NOW.getMonth()).length),pct=mu/a.monthLimit*100,fm=n=>n.toLocaleString("pt-BR",{maximumFractionDigits:0}),usd=v=>"US$ "+v.toFixed(2).replace(".",",");
  const MOD={sonnet:"Claude Sonnet (equilíbrio, recomendado)",haiku:"Claude Haiku (mais econômico)",opus:"Claude Opus (mais capaz)"};
  return `<div class="grid g2"><div class="card"><h2>Chave da API <span class="tag-demo">simulada</span></h2><dl class="kv"><dt>Chave</dt><dd><span class="mono">${esc(a.key)}</span></dd><dt>Situação</dt><dd><span class="badge b-ok">Válida</span></dd><dt>Cadastrada em</dt><dd>${fDate(a.since)}</dd><dt>Onde fica guardada</dt><dd>Cofre criptografado no computador da Cruz</dd></dl><p class="note mt">A chave é da própria Cruz, nunca aparece por inteiro e nunca é enviada ao desenvolvedor. O consumo é cobrado direto na conta da Cruz.</p><div class="row"><button class="btn primary" data-do="claudeKey">Substituir chave</button><button class="btn" data-do="claudeTest">Testar chave</button><button class="btn danger" data-do="claudeRemove">Remover</button></div></div>
 <div class="card"><h2>Consumo do mês</h2><div class="kvs"><div><span class="hint">Custo estimado</span><b>${usd(mu)}</b><span class="hint">≈ ${brl(mu*a.usdBrl)} (cotação simulada)</span></div><div><span class="hint">Chamadas</span><b>${fm(calls)}</b></div><div><span class="hint">Tokens (entrada/saída)</span><b>${(tin/1e6).toFixed(2).replace(".",",")} M / ${(tout/1e6).toFixed(2).replace(".",",")} M</b></div><div><span class="hint">Custo por nota</span><b>${usd(mu/notesM)}</b></div></div><div class="spread mt"><span class="note">Limite mensal ${usd(a.monthLimit)}</span><b>${Math.round(pct)}%</b></div><div class="prog ${pct>80?"err":pct>60?"warn":""}"><i style="width:${Math.min(100,pct)}%"></i></div><p class="note">Hoje: ${usd(today.usd)} de ${usd(a.dayLimit)} no limite diário.</p></div></div>
 <div class="card mt"><h2>Consumo por dia (últimos 30 dias, US$)</h2><div class="chart30" role="img" aria-label="Consumo diário do Claude">${S.apiDaily.map((x,i)=>`<i class="${i===29?"today":""}" style="height:${Math.max(2,x.usd/mx*100)}%" title="${fDate(x.date)}: ${usd(x.usd)}"></i>`).join("")}</div><div class="bars-foot"><span>${fDate(S.apiDaily[0].date).slice(0,5)}</span><span>hoje em dourado</span><span>${fDate(today.date).slice(0,5)}</span></div></div>
 <div class="grid g2 mt"><div class="card"><h2>Consumo por tarefa (mês)</h2><div class="tablewrap"><table><thead><tr><th>Tarefa</th><th class="num">Chamadas</th><th class="num">Custo</th></tr></thead><tbody>${[["Interpretar e-mails de pedidos","extract"],["Validar e conferir dados","validate"],["Redigir respostas aos clientes","reply"],["Resumo diário para o gerente","summary"]].map(([l,k])=>`<tr><td>${l}</td><td class="num">${fm(calls*S.apiBreak[k])}</td><td class="num">${usd(mu*S.apiBreak[k])}</td></tr>`).join("")}</tbody></table></div></div>
 <div class="card"><h2>Limites e modelo</h2><div class="form2"><div class="field full"><label for="aMod">Modelo usado</label><select id="aMod">${Object.entries(MOD).map(([k,v])=>`<option value="${k}" ${a.model===k?"selected":""}>${v}</option>`).join("")}</select></div><div class="field"><label for="aMon">Limite mensal (US$)</label><input type="number" id="aMon" min="5" max="500" value="${a.monthLimit}"></div><div class="field"><label for="aDay">Limite diário (US$)</label><input type="number" id="aDay" min="1" max="100" step="0.5" value="${a.dayLimit}"></div><div class="field full"><label for="aAct">Ao atingir o limite</label><select id="aAct">${["Apenas avisar","Pausar a interpretação automática (modo manual)","Pausar todo o uso do Claude"].map(x=>`<option ${a.action===x?"selected":""}>${x}</option>`).join("")}</select></div></div></div></div>
 <div class="card mt"><h2>Armazenamento e privacidade dos dados enviados ao Claude</h2><div class="grid g2"><div>${tog("aMask","Mascarar CPF e CNPJ antes de enviar","Só os últimos dígitos vão ao Claude",a.maskDocs)}${tog("aNoAtt","Não enviar anexos completos","Só o texto do e-mail é interpretado",a.noAttach)}</div><div><div class="form2"><div class="field"><label for="aRet">Guardar histórico de interpretações por (dias)</label><input type="number" id="aRet" min="1" max="365" value="${a.retDays}"></div><div class="field"><label>Espaço usado pelo histórico</label><div><b>${a.storeMB} MB</b></div></div></div><button class="btn sm danger" data-do="clearApi">Limpar histórico agora</button></div></div><div class="row mt"><button class="btn primary" data-do="saveClaude">Salvar configurações</button></div></div>`};

/* --- Backups e logs --- */
const bkLogRows=k=>{const L=(k==="cloud"?S.bk.cloudLogs:S.bk.logs),from=addDays(NOW,-parseInt(BKF.days));from.setHours(0,0,0,0);
  return L.filter(l=>l.d>=from&&(!BKF.st||(BKF.st==="ok")===l.ok)).map(l=>`<tr class="click" data-do="viewLog" data-k="${k}" data-id="${l.id}"><td>${fDT(l.d)}</td><td>${l.type}</td><td class="num">${l.files}</td><td class="num">${l.size}</td><td>${l.dur}</td><td>${l.ok?'<span class="badge b-ok">Concluído</span>':`<span class="badge b-err">Falhou: ${esc(l.err)}</span>`}</td><td><button class="btn sm">Ver log</button></td></tr>`).join("")||'<tr><td colspan="7" class="note">Nenhum registro no período.</td></tr>'};
VIEWS.backups=()=>{const b=S.bk,adm=can.admin()||perm("backups"),pctc=b.cloudUsed/b.cloudGB*100;
  const head=tabs(BK_TAB,[["cfg","Configuração"],["local","Logs do HD local"],["cloud","Logs da nuvem"]],"tabBk");
  if(BK_TAB==="cfg")return head+`<div class="grid g2"><div class="card"><h2>Agendamento e retenção</h2><div class="form2"><div class="field"><label for="bkt">Horário</label><input type="time" id="bkt" value="${b.time}"></div><div class="field"><label for="bkf">Frequência</label><select id="bkf">${["Diário","Semanal","A cada 12 horas"].map(x=>`<option ${b.freq===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label for="bkr">Retenção (dias)</label><input type="number" id="bkr" min="7" max="365" value="${b.retention}"></div><div class="field"><label>Arquivos incluídos</label><div class="row">${Object.keys(b.types).map(t=>`<label style="margin:0;font-weight:500"><input type="checkbox" data-bkt="${t}" ${b.types[t]?"checked":""}> ${t}</label>`).join("")}</div></div></div>${tog("bkusb","HD USB (local)","Cópia no HD de 1 TB conectado ao computador.",b.usb)}${tog("bkcloud","Nuvem criptografada (serviço de terceiros)",`Contratada direto com o fornecedor do armazenamento, por volume. Atual: ${b.cloudGB} GB.`,b.cloud)}<div class="field mt"><label for="bkrec">Enviar o relatório de cada backup para</label><input type="text" id="bkrec" value="${esc(b.recipients)}"></div>${tog("bkml","Incluir o log do backup em nuvem no e-mail","",b.mailCloudLog)}<div class="row mt"><button class="btn primary" data-do="saveBkCfg" ${adm?"":"disabled"}>Salvar</button><button class="btn" data-do="runBk" ${adm?"":"disabled"}>Executar backup agora</button><button class="btn" data-do="mailBkNow">Enviar relatório por e-mail</button><button class="btn" data-do="restoreTest" ${adm?"":"disabled"}>Testar restauração</button></div><div id="bkprog" class="mt hide"><div class="prog"><i style="width:0"></i></div><p class="note" id="bkmsg"></p></div></div>
  <div class="card"><h2>Últimos resultados</h2>${[["Local (HD USB)",b.logs[0]],["Nuvem",b.cloudLogs[0]]].map(([n,l])=>`<div class="svc"><div><b>${n}</b><small>${fDT(l.d)} · ${l.files} arquivos · ${l.size}</small></div><span class="badge ${l.ok?"b-ok":"b-err"}">${l.ok?"Concluído":"Falhou"}</span></div>`).join("")}<h3 class="mt">Retenção</h3><p class="note">Cópias com mais de <b>${b.retention} dias</b> são removidas automaticamente depois de cada backup bem-sucedido. O relatório de cada execução, com o log da nuvem, vai para: ${esc(b.recipients)}.</p></div></div>`;
  const k=BK_TAB;const cloudInfo=k==="cloud"?`<div class="card" style="margin-bottom:16px"><div class="spread"><div><b>Nuvem criptografada</b> <span class="badge ${b.cloud?"b-ok":"b-mute"}">${b.cloud?"Ativa":"Desativada"}</span><div class="note">Criptografia no computador antes do envio. Última sincronização: ${fDT(b.cloudLogs[0].d)}</div></div><div class="row"><button class="btn sm" data-do="runCloud">Sincronizar agora</button><button class="btn sm" data-do="cloudExpand">Ampliar espaço</button></div></div><div class="spread mt"><span>${b.cloudUsed.toString().replace(".",",")} GB usados de ${b.cloudGB} GB</span><b>${Math.round(pctc)}%</b></div><div class="prog ${pctc>85?"err":pctc>70?"warn":""}"><i style="width:${pctc}%"></i></div></div>`:"";
  return head+cloudInfo+`<div class="card"><div class="spread" style="margin-bottom:12px"><div class="row"><select id="bkLogSt" style="width:auto" aria-label="Filtrar resultado"><option value="">Todos os resultados</option><option value="ok" ${BKF.st==="ok"?"selected":""}>Concluídos</option><option value="fail" ${BKF.st==="fail"?"selected":""}>Com falha</option></select><select id="bkLogDays" style="width:auto" aria-label="Período">${[["7","Últimos 7 dias"],["30","Últimos 30 dias"],["90","Últimos 90 dias"]].map(([v,l])=>`<option value="${v}" ${BKF.days===v?"selected":""}>${l}</option>`).join("")}</select></div><button class="btn" data-do="exportLogs" data-k="${k}">Exportar CSV</button></div><div class="tablewrap"><table><thead><tr><th>Data e hora</th><th>Tipo</th><th class="num">Arquivos</th><th class="num">Tamanho</th><th>Duração</th><th>Resultado</th><th></th></tr></thead><tbody>${bkLogRows(k)}</tbody></table></div><p class="note mt">Clique numa linha para ler o log completo, baixar ou enviar por e-mail.</p></div>`};

const _ov=VIEWS.overview;VIEWS.overview=()=>{const left=Math.round((S.lic.expiry-NOW)/864e5);const a=left<=60?`<div class="alert"><span>A licença do sistema vence em ${left} dias (${fDate(S.lic.expiry)}).</span><button class="linkbtn" data-nav="license">Ver licenciamento</button></div>`:"";return a+_ov()};
VIEWS.license=()=>{const L=S.lic,left=Math.round((L.expiry-NOW)/864e5),act=S.users.filter(u=>u.active).length,pct=act/L.limit*100,tot=Math.round((L.expiry-L.start)/864e5),used=Math.min(100,Math.max(0,(tot-left)/tot*100));

  return `${left<=60&&left>=0?`<div class="alert"><span>A licença vence em ${left} dias. Solicite a renovação com antecedência.</span><button class="linkbtn" data-act="renew">Renovar licença</button></div>`:""}

  <div class="grid g2 mt"><div class="card"><div class="spread"><h2>Licença de uso</h2><span class="badge ${st[0]}">${st[1]}</span></div><dl class="kv"><dt>Plano</dt><dd>${esc(L.plan)} (limite de ${L.limit})</dd><dt>Início</dt><dd>${fDate(L.start)}</dd><dt>ID da instalação</dt><dd><span class="mono">${L.installId}</span></dd><dt>Assinatura</dt><dd>Válida</dd><dt>Modo offline</dt><dd>Tolerância de 15 dias sem internet</dd></dl><div class="prog mt ${left<=30?"err":left<=60?"warn":""}"><i style="width:${used}%"></i></div><p class="note">${L.included?"O 1º ano de licença está incluso no projeto. ":""}Com a licença vencida, só ficam bloqueados novos usuários e alterações; notas emitidas e arquivos continuam acessíveis.</p><div class="row"><button class="btn" data-act="checkLic">Verificar licença agora</button><button class="btn primary" data-act="renew" ${perm("license")?"":"disabled"}>Renovar licença</button><button class="btn" data-act="addSeats" ${perm("license")?"":"disabled"}>Adicionar usuários</button><button class="btn" data-do="licJson">Ver arquivo da licença</button></div></div>
  <div class="card"><h2>Usuários da licença</h2><div class="spread"><span><b>${act}</b> de <b>${L.limit}</b> em uso</span><span class="note">vagas livres: ${Math.max(0,L.limit-act)}</span></div><div class="prog mt ${pct>=100?"err":pct>=80?"warn":""}"><i style="width:${Math.min(100,pct)}%"></i></div><p class="note">A licença informa ao desenvolvedor somente a quantidade de usuários, nunca nomes, clientes ou notas (LGPD).</p><h3 class="mt">Valores de referência</h3><table><tbody><tr><td>Licença anual (1 a 5 usuários)</td><td class="num">${brl(550)}</td></tr><tr><td>Licença bianual (1 a 5 usuários)</td><td class="num">${brl(985)}</td></tr><tr><td>Usuário adicional (6 a 15), por ano</td><td class="num">${brl(77)}</td></tr><tr><td>Pagamento mensal opcional</td><td class="num">${brl(45.83)}</td></tr></tbody></table></div></div>
  <div class="grid g2 mt"><div class="card"><h2>Módulos incluídos</h2>${S.licMods.map(m=>`<div class="svc"><div><b>${m[0]}</b><small>${m[2]}</small></div><span class="badge ${m[1]?"b-ok":"b-mute"}">${m[1]?"Ativo":"Inativo"}</span></div>`).join("")}</div>
  <div class="card"><h2>Pedidos e histórico</h2>${S.requests.length?`<div class="tablewrap"><table><thead><tr><th>Pedido</th><th>Descrição</th><th class="num">Valor</th><th>Situação</th></tr></thead><tbody>${S.requests.map(r=>`<tr><td>${fDT(r.t)}</td><td>${esc(r.desc)}</td><td class="num">${brl(r.value)}</td><td><span class="badge ${r.status==="Licença emitida"?"b-ok":"b-warn"}">${r.status}</span></td></tr>`).join("")}</tbody></table></div>`:'<p class="note">Nenhum pedido em aberto. Ao solicitar, o desenvolvedor confirma o pagamento e publica a nova licença assinada; o sistema atualiza sozinho.</p>'}

  <h3 class="mt">Histórico</h3><table><tbody>${S.licHist.map(h=>`<tr><td>${fDate(h[0])}</td><td>${esc(h[1])}<div class="note">${esc(h[2])}</div></td></tr>`).join("")}</tbody></table></div></div>`};

/* ---------- gráficos ---------- */
const CH={};
const brlS=v=>"R$ "+Math.round(v).toLocaleString("pt-BR");
function chLabels(it,fs,L,W,R,n){const cw=fs*.6,ord=it.map((q,k)=>k).sort((a,b)=>it[b].v-it[a].v),keep=[];
  it.forEach(q=>{q.w=q.t.length*cw+6;q.x=Math.min(Math.max(q.x,L+q.w/2),W-R-q.w/2+4)});
  ord.forEach(k=>{const q=it[k];if(q.v===0&&n>12)return;if(keep.every(j=>{const r=it[j];return Math.abs(r.x-q.x)>=(r.w+q.w)/2||Math.abs(r.y-q.y)>=fs+3}))keep.push(k)});
  return keep.sort((a,b)=>a-b).map(k=>it[k])}
function chartSvg(id){const {labels,vals,o}=CH[id],p=S.chartPref[id],fmt=o.fmt||(v=>String(v)),W=720,H=o.h||220,L=o.axisW||38,R=12,T=26,B=26,n=vals.length,raw=Math.max(...vals,.0001)/4,mag=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/mag,stp=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*mag,mx=stp*4,pw=W-L-R,ph=H-T-B,y=v=>T+ph*(1-v/mx),sw=pw/n,bx=i=>L+i*sw,px=i=>L+(n===1?pw/2:(i+.5)*sw);
  const step=Math.ceil(n/(o.maxLabels||8)),fs=n>20?9:11;
  let g="";[0,.25,.5,.75,1].forEach(f=>{const v=mx*f,yy=y(v),ax=o.axis||(stp<1?(q=>q.toFixed(1).replace('.',',')):(q=>o.fmt&&!o.fmtIsPlain?o.fmt(Math.round(q)):String(Math.round(q))));g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text x="${L-6}" y="${yy+4}" text-anchor="end">${ax(v)}</text>`});
  let s="";
  if(p.type==="bar"){const li=[];vals.forEach((v,i)=>{const cls=(o.today&&i===n-1)?"td":(o.wk&&o.wk[i]?"we":""),h=ph*v/mx,bw=Math.min(sw*.68,46);s+=`<rect class="bar ${cls}" x="${bx(i)+(sw-bw)/2}" y="${T+ph-h}" width="${bw}" height="${Math.max(h,2)}" rx="4"><title>${labels[i]}: ${fmt(v)}</title></rect>`;li.push({i,v,x:px(i),y:T+ph-h-5,t:fmt(v)})});if(p.vals)chLabels(li,fs,L,W,R,n).forEach(q=>{s+=`<text class="vl" x="${q.x}" y="${q.y}" text-anchor="middle" style="font-size:${fs}px">${q.t}</text>`})}
  else{const li=[],pts=vals.map((v,i)=>[px(i),y(v)]),line=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
    s+=`<path class="ar" d="${line} L${pts[n-1][0].toFixed(1)} ${T+ph} L${pts[0][0].toFixed(1)} ${T+ph} Z"/><path class="ln" d="${line}"/>`;

  let xl="";labels.forEach((l,i)=>{if(i%step===0||(i===n-1&&(n-1)%step>=step/2))xl+=`<text x="${px(i)}" y="${H-8}" text-anchor="middle">${l}</text>`});
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||"Gráfico")}">${g}${s}${xl}</svg>`}
function chartBox(id,title,labels,vals,o={}){CH[id]={labels,vals,o};S.chartPref=S.chartPref||{};const p=S.chartPref[id]=S.chartPref[id]||{type:"area",vals:true};

const chRedraw=id=>{const e=$("#chw_"+id);if(e){const d=document.createElement("div");d.innerHTML=chartBox(id,$("h2",e).textContent,CH[id].labels,CH[id].vals,CH[id].o);e.replaceWith(d.firstElementChild)}};

  const mc=S.apiDaily.filter(x=>x.date.getMonth()===NOW.getMonth()),mu=monthUsd(),dim=new Date(NOW.getFullYear(),NOW.getMonth()+1,0).getDate(),el=Math.max(1,mc.length),
    tin=mc.reduce((s,x)=>s+x.tin,0),tout=mc.reduce((s,x)=>s+x.tout,0),calls=mc.reduce((s,x)=>s+x.calls,0),notes=Math.max(1,S.notes.filter(n=>n.date.getMonth()===NOW.getMonth()).length),
    proj=mu/el*dim,sug=Math.max(5,Math.ceil(proj*(1+a.margin/100)/5)*5),fx=a.usdBrl,U=v=>"US$ "+v.toFixed(2).replace(".",","),M=n=>(n/1e6).toFixed(2).replace(".",",")+" M",N=n=>Math.round(n).toLocaleString("pt-BR"),

  const card=`<div class="card mt" id="apiUse"><div class="spread"><h2 style="margin:0">Consumo em tokens, US$ e R$ <span class="tag-demo">simulado</span></h2><button class="btn sm" data-do="apiCsv">Baixar CSV</button></div>
  <div class="kvs mt"><div><span class="hint">Tokens no mês (entrada + saída)</span><b>${M(tin+tout)}</b><span class="hint">${M(tin)} entrada · ${M(tout)} saída</span></div><div><span class="hint">Custo no mês</span><b>${U(mu)}</b><span class="hint">≈ ${brl(mu*fx)}</span></div><div><span class="hint">Custo médio por nota</span><b>${U(mu/notes)}</b><span class="hint">≈ ${brl(mu/notes*fx)} · ${N(calls)} chamadas</span></div><div><span class="hint">Projeção até o fim do mês</span><b>${U(proj)}</b><span class="hint">≈ ${brl(proj*fx)}</span></div></div>
  <div class="spread mt"><span class="note">Limite mensal ${U(a.monthLimit)} (≈ ${brl(a.monthLimit*fx)})</span><b>${Math.round(pct)}%</b></div><div class="prog ${pct>=90?"err":pct>=70?"warn":""}" style="position:relative"><i style="width:${Math.min(100,pct)}%"></i></div>
  <p class="note">Avisos automáticos ao chegar em 70% (${U(a.monthLimit*.7)}) e em 90% (${U(a.monthLimit*.9)}) do limite, no painel, por e-mail${S.wa&&S.wa.connected?" e por WhatsApp":""}.</p>
  <div class="grid g2 mt"><div><h3 style="margin:0 0 8px">Limite mensal sugerido, com margem de segurança</h3><div class="form2"><div class="field"><label for="apMg">Margem de segurança</label><select id="apMg">${[0,20,30,40,50,75,100].map(v=>`<option value="${v}" ${a.margin===v?"selected":""}>${v}%</option>`).join("")}</select></div><div class="field"><label for="apFx">Cotação do dólar (R$)</label><input type="number" id="apFx" min="1" max="20" step="0.01" value="${fx}"></div></div>

  <p class="note">${low?`O limite atual (${U(a.monthLimit)}) está abaixo do sugerido. Considere aumentar para evitar que o serviço pare no fim do mês.`:`O limite atual (${U(a.monthLimit)}) cobre a projeção com a margem escolhida.`}</p><div class="row"><button class="btn" data-do="apiCalc">Recalcular</button>${low?'<button class="btn primary" data-do="apiApply">Usar limite sugerido</button>':""}</div></div>
  <div><h3 style="margin:0 0 8px">Por tarefa (mês)</h3><div class="tablewrap"><table><thead><tr><th>Tarefa</th><th class="num">Entrada</th><th class="num">Saída</th><th class="num">US$</th><th class="num">R$</th></tr></thead><tbody>${rows}</tbody></table></div></div></div>
  <p class="note mt">Medição: na primeira semana com dados reais, o sistema registra os tokens de cada chamada e calcula o custo médio por nota. A projeção usa esse custo e o volume mensal da Cruz. A cotação é configurável e o valor em reais é apenas uma referência.</p></div>`;
  return h.replace('<div class="card mt"><h2>Armazenamento e privacidade',card+'<div class="card mt"><h2>Armazenamento e privacidade')};
DO.apiCalc=()=>{S.api.margin=+val("apMg");S.api.usdBrl=Math.min(20,Math.max(1,+val("apFx")||5.5));paint()};

VIEWS.phases=()=>{const f=S.phTab,c1=FEAT.filter(x=>x[2]===1).length,c2=FEAT.filter(x=>x[2]===2).length,co=FEAT.filter(x=>x[2]==="o").length,ct=FEAT.filter(x=>x[2]==="t").length,L=FEAT.filter(x=>f==="all"||String(x[2])===f);

  <div class="card mt"><div class="spread" style="margin-bottom:10px"><h2 style="margin:0">Todos os recursos do projeto</h2></div>${tabs(f,[["all","Todos"],["1","Fase 1"],["2","Fase 2"],["o","Opcionais"],["t","Terceiros"]],"tabPh")}<div class="tablewrap"><table><thead><tr><th>Área</th><th>Recurso</th><th>Fase</th><th>Nesta demonstração</th></tr></thead><tbody>${L.map(x=>`<tr><td>${x[0]}</td><td>${x[3]?optLink(x[3],esc(x[1])):esc(x[1])}</td><td>${phBadge(x[2])}</td><td class="note">${phState(x[2])}</td></tr>`).join("")}</tbody></table></div><p class="note mt">A divisão em fases é a proposta para o projeto e será confirmada no contrato. Valores e prazos estão no orçamento.</p></div>`};
