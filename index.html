/* ---------- cancelamentos (Fase 2) ---------- */
const CN_DAYS=30;
const cnSteps=c=>[["Pedido feito",true],["Aprovação do gerente",c.st!=="Aguardando aprovação"&&c.st!=="Recusado"],["Cancelada no Emissor",c.st==="Cancelada"],["Cliente avisado",!!c.notified]];
VIEWS.cancel=()=>{const can_=perm("cancel"),done=new Set(S.cancels.filter(c=>c.st!=="Recusado").map(c=>c.n)),el=[...S.notes].sort((a,b)=>b.date-a.date).slice(0,10),C=S.cancels,
  k=[["Aguardando aprovação",C.filter(c=>c.st==="Aguardando aprovação").length],["Canceladas",C.filter(c=>c.st==="Cancelada").length],["Recusados",C.filter(c=>c.st==="Recusado").length],["Prazo para solicitar",CN_DAYS+" dias"]];
  const mgr=ROLE==="Administrador"||ROLE==="Gerente";
  return `<div class="callout ph2b"><span class="ph ph2">Fase 2</span> <b>Prévia.</b> Fluxo completo de cancelamento de NFS-e: pedido, aprovação do gerente, envio ao Emissor Nacional (simulado) e aviso ao cliente. As regras e os prazos reais dependem do município e serão confirmados nos testes com a Cruz.</div>
  <div class="card mt"><h2>Como funciona</h2><ol class="steps4">${[["1","Solicitar","Quem tem permissão escolhe a nota, o motivo e escreve a justificativa."],["2","Aprovar","O gerente confere e aprova ou recusa. Sem aprovação nada segue."],["3","Cancelar no Emissor","O sistema envia o pedido ao Emissor Nacional e guarda o protocolo."],["4","Avisar o cliente","Se marcado, o cliente recebe o aviso por e-mail. Depois pode ser emitida uma nota nova."]].map(x=>`<li><span class="stepn">${x[0]}</span><div><b>${x[1]}</b><small>${x[2]}</small></div></li>`).join("")}</ol></div>
  <div class="grid g4 mt">${k.map(([l,v])=>`<div class="card kpi"><div class="lbl">${l}</div><div class="num" style="font-size:${String(v).length>4?24:34}px">${v}</div></div>`).join("")}</div>
  <div class="grid g2 mt"><div class="card"><h2>Notas que podem ser canceladas</h2><div class="tablewrap"><table><thead><tr><th>Nº</th><th>Cliente</th><th class="num">Valor</th><th></th></tr></thead><tbody>${el.map(n=>{const d=Math.floor((NOW-n.date)/864e5);return `<tr><td>${n.n}<div class="note">${fDT(n.date)} · há ${d} dia${d===1?"":"s"}</div></td><td>${esc(n.client)}<div class="note">${esc(n.taker)}</div></td><td class="num">${brl(n.value)}</td><td>${done.has(n.n)?'<span class="badge b-mute">Em andamento</span>':d>CN_DAYS?'<span class="badge b-err">Fora do prazo</span>':`<button class="btn sm danger" data-do="cnReq" data-n="${n.n}">Solicitar cancelamento</button>`}</td></tr>`}).join("")}</tbody></table></div></div>
  <div class="card"><h2>Pedidos de cancelamento</h2>${C.length?C.map((c,i)=>`<div class="cnreq"><div class="spread"><div><b>NFS-e ${c.n}</b> · ${esc(c.client)}<small>${esc(c.reason)} · por ${esc(c.by)} em ${fDT(c.t)}</small><small>${esc(c.why)}</small>${c.proto?`<small>Protocolo do Emissor (demonstração): ${c.proto}</small>`:""}</div><span class="badge ${c.st==="Cancelada"?"b-ok":c.st==="Recusado"?"b-err":"b-warn"}">${c.st}</span></div><div class="tl" aria-label="Andamento">${cnSteps(c).map(([l,ok])=>`<span class="${ok?"on":""}">${ok?"✓":"•"} ${l}</span>`).join("")}</div>${c.st==="Aguardando aprovação"&&can_&&mgr?`<div class="row mt" style="justify-content:flex-end"><button class="btn sm" data-do="cnNo" data-i="${i}">Recusar</button><button class="btn sm primary" data-do="cnYes" data-i="${i}">Aprovar e cancelar</button></div>`:c.st==="Aguardando aprovação"?'<p class="note mt">Aguardando um gerente aprovar.</p>':""}${c.st==="Cancelada"&&!c.notified&&can_?`<div class="row mt" style="justify-content:flex-end"><button class="btn sm" data-do="cnNotify" data-i="${i}">Avisar o cliente</button></div>`:""}</div>`).join(""):'<p class="note">Nenhum pedido de cancelamento. Escolha uma nota ao lado para ver o fluxo funcionando.</p>'}${can_?"":'<p class="note mt">Seu perfil só consulta esta tela.</p>'}</div></div>
  <div class="card mt"><h2>Regras desta prévia</h2><ul class="tight"><li>Prazo para solicitar: <b>${CN_DAYS} dias</b> após a emissão (ajustável conforme o município).</li><li>Aprovação obrigatória de gerente ou administrador. Quem solicita não aprova o próprio pedido.</li><li>Justificativa com pelo menos 15 caracteres, guardada na auditoria.</li><li>A nota cancelada sai dos relatórios do mês.</li><li>Notas já com <b>guia paga</b> ou com <b>regra própria do município</b> podem exigir pedido direto na prefeitura. O sistema avisa quando souber.</li></ul></div>`};
DO.cnReq=t=>{const n=S.notes.find(x=>x.n==t.dataset.n);modal(`Cancelar a NFS-e ${n.n}`,`<p class="note">${esc(n.client)} · tomador ${esc(n.taker)} · ${brl(n.value)}</p><div class="field"><label for="cr">Motivo</label><select id="cr">${["Erro nos dados do tomador","Valor incorreto","Duplicidade","Serviço não prestado"].map(x=>`<option>${x}</option>`).join("")}</select></div><div class="field"><label for="cw">Justificativa (mínimo 15 caracteres)</label><textarea id="cw" rows="3"></textarea></div>${tog("cnRe","Preparar uma nota substituta","Depois do cancelamento, o pedido volta para a fila de aprovações com os dados corrigidos.",false)}${tog("cnAv","Avisar o cliente por e-mail ao cancelar","",true)}<p class="note mt">O gerente precisa aprovar antes de o pedido seguir ao Emissor Nacional.</p>`,
  [{label:"Voltar"},{label:"Enviar para aprovação",cls:"danger",fn:()=>{if(val("cw").trim().length<15){toast("Explique o motivo com pelo menos 15 caracteres.","err");return false}S.cancels.unshift({n:n.n,client:n.client,reason:val("cr"),why:val("cw").trim(),by:me().name,t:new Date(),st:"Aguardando aprovação",replace:yes("cnRe"),warn:yes("cnAv")});audit(`Pediu o cancelamento da NFS-e ${n.n}`);toast("Pedido enviado para aprovação do gerente.","ok");paint()}}])};
DO.cnYes=t=>{const c=S.cancels[t.dataset.i];if(c.by===me().name&&ROLE!=="Administrador")return toast("Quem pediu não pode aprovar o próprio cancelamento.","err");c.st="Cancelada";c.proto="CANC-"+String(c.n).padStart(6,"0")+"-DEMO";if(c.warn)c.notified=true;audit(`Aprovou o cancelamento da NFS-e ${c.n}`);toast(`NFS-e ${c.n} cancelada no Emissor (simulado).${c.warn?" Cliente avisado por e-mail.":""}`,"ok");notify(`NFS-e ${c.n} cancelada.`,"ok");paint()};
DO.cnNo=t=>{const c=S.cancels[t.dataset.i];c.st="Recusado";audit(`Recusou o cancelamento da NFS-e ${c.n}`);toast("Pedido recusado.","warn");paint()};
DO.cnNotify=t=>{const c=S.cancels[t.dataset.i];c.notified=true;audit(`Avisou o cliente sobre o cancelamento da NFS-e ${c.n}`);toast(`Aviso enviado ao cliente ${c.client} (simulado).`,"ok");paint()};

/* ---------- relatórios (Fase 2): 5 relatórios com envio ao cliente ---------- */
const RP_LIST=[["r1","Resumo mensal","Notas e valores do mês, por cliente."],["r2","Notas emitidas","Lista das notas do período, com PDF e XML."],["r3","Pedidos e prazos","Pedidos recebidos e o que aconteceu com cada um."],["r4","Cancelamentos","Notas canceladas e pedidos de cancelamento."],["r5","Procurações e certificado","Validade da procuração e do certificado A1."]];
let RP_TAB="r1",RP_CLIENT="";
function repMonth(cl){const from=new Date(NOW.getFullYear(),NOW.getMonth(),1);return S.notes.filter(n=>n.date>=from&&(!cl||n.client===cl)&&!S.cancels.some(c=>c.n===n.n&&c.st==="Cancelada"))}
function repData(cl){const L=repMonth(cl),by={};L.forEach(n=>{(by[n.client]=by[n.client]||{c:0,v:0});by[n.client].c++;by[n.client].v+=n.value});return {L,by,tot:L.reduce((s,n)=>s+n.value,0)}}
function repOrders(cl){return S.orders.filter(o=>!cl||o.client===cl)}
function repCancels(cl){return S.cancels.filter(c=>!cl||c.client===cl)}
function repCerts(cl){return S.clients.filter(c=>!cl||c.name===cl)}
const daysTo=d=>Math.ceil((d-NOW)/864e5);
function repTable(id,cl){
  if(id==="r1"){const {by,tot}=repData(cl),r=Object.entries(by).sort((a,b)=>b[1].v-a[1].v);return {h:["Cliente","Notas","Valor","%"],num:[1,2,3],rows:r.map(([k,v])=>[k,v.c,brl(v.v),(tot?Math.round(v.v/tot*100):0)+"%"]),foot:`Total: ${r.reduce((s,x)=>s+x[1].c,0)} notas · ${brl(tot)}`}}
  if(id==="r2"){const L=[...repMonth(cl)].sort((a,b)=>b.date-a.date);return {h:["Nº","Data","Cliente","Tomador","Valor"],num:[4],rows:L.map(n=>[n.n,fDT(n.date),n.client,n.taker,brl(n.value)]),foot:`${L.length} notas no mês`}}
  if(id==="r3"){const O=repOrders(cl),k=Object.keys(ST);return {h:["Situação","Pedidos","Valor"],num:[1,2],rows:k.map(s=>{const l=O.filter(o=>o.status===s);return [ST[s][1],l.length,brl(l.reduce((a,o)=>a+o.value,0))]}),foot:`${O.length} pedidos recebidos`}}
  if(id==="r4"){const C=repCancels(cl);return {h:["NFS-e","Cliente","Motivo","Situação","Pedido em"],num:[],rows:C.map(c=>[c.n,c.client,c.reason,c.st,fDT(c.t)]),foot:C.length?`${C.length} pedidos`:"Nenhum cancelamento registrado.",empty:"Nenhum cancelamento registrado neste período."}}
  const R=repCerts(cl);return {h:["Cliente","Procuração","Vence em","Situação"],num:[2],rows:R.map(c=>{if(!c.procExp)return [c.name,c.proc,"-","Sem procuração"];const d=daysTo(c.procExp);return [c.name,c.proc,fDate(c.procExp),d<0?"Vencida":d<=60?`Vence em ${d} dias`:"Em dia"]}),foot:`Certificado A1 da Cruz: validade e alertas em Configurações > Emissor e certificado.`}}
function repKpis(id,cl){
  if(id==="r1"){const {L,by,tot}=repData(cl);return [["Notas no mês",L.length],["Valor total",brl(tot)],["Valor médio",brl(L.length?tot/L.length:0)],["Clientes",Object.keys(by).length]]}
  if(id==="r2"){const L=repMonth(cl);return [["Notas",L.length],["Maior valor",brl(Math.max(0,...L.map(n=>n.value)))],["Com PDF e XML",L.length],["Tomadores",new Set(L.map(n=>n.taker)).size]]}
  if(id==="r3"){const O=repOrders(cl);return [["Recebidos",O.length],["Enviados ao cliente",O.filter(o=>o.status==="enviada").length],["Com inconsistência",O.filter(o=>o.status==="erro").length],["Devolvidos",O.filter(o=>o.status==="rejeitada").length]]}
  if(id==="r4"){const C=repCancels(cl);return [["Pedidos",C.length],["Canceladas",C.filter(c=>c.st==="Cancelada").length],["Em aprovação",C.filter(c=>c.st==="Aguardando aprovação").length],["Recusados",C.filter(c=>c.st==="Recusado").length]]}
  const R=repCerts(cl);return [["Clientes",R.length],["Em dia",R.filter(c=>c.procExp&&daysTo(c.procExp)>60).length],["Vencem em 60 dias",R.filter(c=>{if(!c.procExp)return false;const d=daysTo(c.procExp);return d>=0&&d<=60}).length],["Vencidas",R.filter(c=>c.procExp&&daysTo(c.procExp)<0).length]]}
const repTbl=(T)=>T.rows.length?`<div class="tablewrap"><table><thead><tr>${T.h.map((x,i)=>`<th${T.num.includes(i)?' class="num"':""}>${x}</th>`).join("")}</tr></thead><tbody>${T.rows.map(r=>`<tr>${r.map((x,i)=>`<td${T.num.includes(i)?' class="num"':""}>${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div><p class="note mt">${T.foot}</p>`:`<p class="note">${T.empty||"Sem dados no período."}</p>`;
VIEWS.reports=()=>{
  const cur=RP_LIST.find(x=>x[0]===RP_TAB),T=repTable(RP_TAB,RP_CLIENT),K=repKpis(RP_TAB,RP_CLIENT),pm=perm("reports");
  const {L,tot}=repData(RP_CLIENT),days=[...Array(NOW.getDate())].map((_,i)=>new Date(NOW.getFullYear(),NOW.getMonth(),i+1)),dv=days.map(d=>L.filter(n=>isoDay(n.date)===isoDay(d)).reduce((s,n)=>s+n.value,0));
  return `<div class="callout ph2b"><span class="ph ph2">Fase 2</span> <b>Prévia.</b> Cinco relatórios para a Cruz e para enviar aos clientes dela, com o e-mail e o formato à escolha. Os dados abaixo são de demonstração.</div>
  ${tabs(RP_TAB,RP_LIST.map(x=>[x[0],x[1]]),"tabRp")}
  <div class="spread mt"><div><h2 style="margin:0">${cur[1]}</h2><span class="note">${cur[2]}</span></div><div class="row"><select id="rpc" style="width:auto" aria-label="Cliente do relatório"><option value="">Todos os clientes</option>${S.clients.map(c=>`<option ${RP_CLIENT===c.name?"selected":""}>${esc(c.name)}</option>`).join("")}</select>${pm?`<button class="btn" data-do="rpCsv">Baixar CSV</button><button class="btn primary" data-do="rpSend">Enviar ao cliente</button>`:""}</div></div>
  <div class="grid g4 mt">${K.map(([l,v])=>`<div class="card kpi"><div class="lbl">${l}</div><div class="num" style="font-size:${String(v).length>6?24:34}px">${v}</div></div>`).join("")}</div>
  ${RP_TAB==="r1"?`<div class="card mt">${chartBox("rp1","Valor emitido por dia (mês atual, R$)",days.map(d=>String(d.getDate())),dv,{fmt:brlS,axisW:56,maxLabels:12,today:false,aria:"Valor emitido por dia",foot:"Dias sem notas aparecem com valor zero"})}</div>`:""}
  <div class="card mt">${repTbl(T)}</div>
  <div class="grid g2 mt"><div class="card"><h2>Envio automático ao cliente</h2>${tog("rpAuto","Enviar o resumo mensal no 1º dia útil","Cada cliente recebe só os próprios dados, no e-mail cadastrado dele.",S.rpAuto,!pm)}<p class="note mt">Fica ativo na Fase 2. Nesta prévia a opção só registra a escolha.</p></div>
  <div class="card"><h2>Últimos envios</h2>${S.rpSent.length?`<div class="tablewrap"><table><thead><tr><th>Quando</th><th>Relatório</th><th>Para</th><th>Formato</th></tr></thead><tbody>${S.rpSent.map(s=>`<tr><td>${fDT(s.t)}</td><td>${esc(s.rep)}</td><td>${esc(s.to)}<div class="note">${esc(s.client)}</div></td><td>${s.fmt}</td></tr>`).join("")}</tbody></table></div>`:'<p class="note">Nenhum envio ainda. Use “Enviar ao cliente”.</p>'}</div></div>`};
DO.tabRp=t=>{RP_TAB=t.dataset.t;paint()};
document.addEventListener("change",e=>{if(e.target.id==="rpc"){RP_CLIENT=e.target.value;paint()}if(e.target.id==="rpAuto"){S.rpAuto=e.target.checked;audit(`${S.rpAuto?"Ativou":"Desativou"} o envio automático do resumo mensal`);toast(S.rpAuto?"Envio automático ativado (prévia).":"Envio automático desativado.","ok")}});
DO.rpCsv=()=>{const T=repTable(RP_TAB,RP_CLIENT);download(`relatorio-${RP_TAB}-demo.csv`,"﻿"+[T.h.join(";"),...T.rows.map(r=>r.join(";"))].join("\n"),"text/csv");audit(`Baixou o relatório "${RP_LIST.find(x=>x[0]===RP_TAB)[1]}"`)};
DO.rpSend=()=>{const cur=RP_LIST.find(x=>x[0]===RP_TAB),first=RP_CLIENT||S.clients[0].name,em=n=>(S.clients.find(c=>c.name===n)||{}).email||"";
  modal(`Enviar “${cur[1]}” ao cliente`,`<div class="field"><label for="rsc">Cliente</label><select id="rsc">${S.clients.map(c=>`<option ${c.name===first?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div><div class="field"><label for="rse">E-mail do destinatário</label><input type="email" id="rse" value="${esc(em(first))}"><span class="hint">Vem do cadastro do cliente. Pode ser trocado só para este envio.</span></div><div class="field"><label for="rsf">Formato do anexo</label><select id="rsf"><option>PDF</option><option>CSV</option><option>PDF e CSV</option></select></div><div class="field"><label for="rsm">Mensagem</label><textarea id="rsm" rows="3">Olá! Segue o relatório “${cur[1]}” do período, com os dados do seu cadastro. Qualquer dúvida, estamos à disposição.</textarea></div><div class="callout">O cliente recebe <b>somente os dados dele</b>, mesmo que a tela esteja mostrando todos os clientes. O envio fica registrado na auditoria.</div>`,
  [{label:"Cancelar"},{label:"Enviar",cls:"primary",fn:()=>{const to=val("rse").trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)){toast("Informe um e-mail válido.","err");return false}const cl=val("rsc");S.rpSent.unshift({t:new Date(),rep:cur[1],client:cl,to,fmt:val("rsf")});S.rpSent=S.rpSent.slice(0,15);audit(`Enviou o relatório "${cur[1]}" ao cliente ${cl}`);toast(`Relatório enviado para ${to} (simulado).`,"ok");paint()}}]);
  const sel=$("#rsc");if(sel)sel.addEventListener("change",()=>{$("#rse").value=em(sel.value)})};

const WA_EV=[["stuck","Pedido parado aguardando aprovação"],["err","Pedido com erro ou inconsistência"],["issued","Nota emitida e enviada ao cliente"],["cert","Certificado A1 perto de vencer"],["bk","Falha de backup"],["claude","Consumo do Claude perto do limite (70% e 90%)"],["lic","Licença perto de vencer"],["down","Serviço sem conexão com o Emissor ou com o e-mail"]];
const waFmt=v=>{const d=String(v).replace(/\D/g,"").replace(/^55(?=\d{10,11}$)/,"");if(d.length===11)return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;if(d.length===10)return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;return null};
function waSeed(){const ev={};WA_EV.forEach(([k])=>{ev[k]={Administrador:["cert","bk","claude","lic","down","err"].includes(k),Gerente:["stuck","err","issued","lic"].includes(k),Aprovador:["stuck","err"].includes(k),Visualizador:false}});
  const ph={},on={};S.users.forEach((u,i)=>{ph[u.id]=`(11) 98888-00${String(i+10)}`;on[u.id]=u.active});
  S.wa={connected:false,number:"",since:null,onlyHours:true,from:"08:00",to:"18:00",maxHour:20,hideSensitive:true,ev,ph,on,log:[]}}
function waSend(text,evKey){const w=S.wa;if(!w||!w.connected)return;const hour=new Date().getHours(),fromH=+w.from.slice(0,2),toH=+w.to.slice(0,2);
  const rec=S.users.filter(u=>u.active&&w.on[u.id]&&w.ph[u.id]&&WA_EV.some(([k])=>(!evKey||k===evKey)&&w.ev[k][u.role]));
  if(!rec.length)return;const held=w.onlyHours&&(hour<fromH||hour>=toH);
  w.log.unshift({t:new Date(),msg:text,to:rec.map(u=>u.name.split(" ")[0]).join(", "),st:held?"Aguardando o horário permitido":"Enviada (simulado)"});w.log=w.log.slice(0,30)}
const _notify=window.notify;window.notify=function(txt,t){_notify(txt,t);waSend(String(txt).replace(/\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}/g,"[CNPJ oculto]"))};
function waView(head){const w=S.wa,roles=ROLE_LIST;
  return head+`<div class="callout ph2b" style="margin-bottom:14px"><span class="ph pho">Opcional</span> <b>Prévia de serviço opcional, sob consulta.</b> Avisos do sistema aos usuários pelo WhatsApp, por perfil. Só administradores veem e configuram esta aba.</div>
  <div class="callout warn"><b>Use um número exclusivo do sistema</b> (um chip dedicado), nunca o WhatsApp principal da Cruz. Esta conexão por QR code é um método não oficial: o WhatsApp pode bloquear o número, e a sessão pode cair com atualizações. Ela só <b>envia avisos aos usuários</b>. Não recebe pedidos de clientes (isso exigiria a API oficial, um serviço de terceiros).</div>
  <div class="grid g2 mt"><div class="card"><h2>Conexão</h2><p><span class="badge ${w.connected?"b-ok":"b-mute"}">${w.connected?"Conectado":"Desconectado"}</span></p><dl class="kv"><dt>Número exclusivo</dt><dd>${w.connected?esc(w.number):"-"}</dd><dt>Conectado desde</dt><dd>${w.since?fDT(w.since):"-"}</dd><dt>Tipo de conexão</dt><dd>QR code (aparelho conectado)</dd></dl><div class="row mt">${w.connected?`<button class="btn" data-do="waTest">Enviar mensagem de teste</button><button class="btn danger" data-do="waDisc">Desconectar</button>`:`<button class="btn primary" data-do="waConnect">Conectar com QR code</button>`}</div></div>
  <div class="card"><h2>Regras de envio</h2>${tog("waOnly","Enviar só dentro do horário","Fora dele, o aviso espera até a próxima janela.",w.onlyHours)}<div class="form2 mt"><div class="field"><label for="waFrom">Das</label><input type="time" id="waFrom" value="${w.from}"></div><div class="field"><label for="waTo">Até</label><input type="time" id="waTo" value="${w.to}"></div><div class="field"><label for="waMax">Máximo de mensagens por hora</label><input type="number" id="waMax" min="1" max="60" value="${w.maxHour}"><span class="hint">Um limite baixo reduz o risco de bloqueio.</span></div></div>${tog("waHide","Não incluir CPF, CNPJ nem valores nas mensagens","Os avisos só dizem o que aconteceu e pedem para abrir o painel.",w.hideSensitive)}</div></div>
  <div class="card mt"><h2>Quem recebe cada aviso, por perfil</h2><div class="tablewrap matrix"><table><thead><tr><th>Aviso</th>${roles.map(r=>`<th>${r}</th>`).join("")}</tr></thead><tbody>${WA_EV.map(([k,l])=>`<tr><td>${l}</td>${roles.map(r=>`<td><input type="checkbox" aria-label="${l} para ${r}" data-waev="${k}|${r}" ${w.ev[k][r]?"checked":""}></td>`).join("")}</tr>`).join("")}</tbody></table></div></div>
  <div class="card mt"><h2>Números dos usuários</h2><p class="note">Cada pessoa precisa concordar em receber avisos no próprio celular. Números fictícios nesta demonstração.</p><div class="tablewrap"><table><thead><tr><th>Usuário</th><th>Perfil</th><th>WhatsApp</th><th>Receber</th></tr></thead><tbody>${S.users.map(u=>`<tr><td>${esc(u.name)}${u.active?"":' <span class="badge b-mute">bloqueado</span>'}</td><td>${esc(u.role)}</td><td><input type="text" inputmode="tel" data-waph="${u.id}" value="${esc(w.ph[u.id]||"")}" style="width:170px" aria-label="WhatsApp de ${esc(u.name)}"></td><td><label class="switch"><input type="checkbox" data-waon="${u.id}" ${w.on[u.id]?"checked":""} aria-label="Receber avisos"><span></span></label></td></tr>`).join("")}</tbody></table></div><div class="row mt"><button class="btn primary" data-do="waSave">Salvar configurações do WhatsApp</button></div></div>
  <div class="card mt"><h2>Últimas mensagens</h2>${w.log.length?`<div class="tablewrap"><table><thead><tr><th>Quando</th><th>Mensagem</th><th>Para</th><th>Situação</th></tr></thead><tbody>${w.log.map(l=>`<tr><td>${fDT(l.t)}</td><td>${esc(l.msg)}</td><td>${esc(l.to)}</td><td>${l.st}</td></tr>`).join("")}</tbody></table></div>`:'<p class="note">Nenhuma mensagem ainda. Conecte o número e use “Enviar mensagem de teste”, ou aprove um pedido para ver um aviso.</p>'}</div>`}
DO.waConnect=()=>modal("Conectar o número exclusivo",`<div class="field"><label for="wn">Número do chip exclusivo (com DDD)</label><input type="text" id="wn" inputmode="tel" placeholder="(11) 90000-0000"></div><div class="row" style="align-items:flex-start">${qrSvg(4242)}<div style="flex:1;min-width:180px"><ol class="tight"><li>No celular do chip exclusivo, abra o WhatsApp.</li><li>Toque em Aparelhos conectados.</li><li>Toque em Conectar um aparelho e leia o QR code.</li></ol><p class="hint">QR code de demonstração: não funciona no WhatsApp real.</p></div></div><div class="callout warn mt">Não use o WhatsApp principal da Cruz. Use um chip só para o sistema.</div>`,
  [{label:"Cancelar"},{label:"Simular leitura do QR code",cls:"primary",fn:()=>{const f=waFmt(val("wn"));if(!f){toast("Informe o número com DDD (10 ou 11 dígitos).","err");return false}S.wa.connected=true;S.wa.number=f;S.wa.since=new Date();audit("Conectou o WhatsApp do sistema (QR code)");toast("WhatsApp conectado (simulado).","ok");paint()}}]);
DO.waDisc=()=>confirmBox("Desconectar o WhatsApp","Os avisos por WhatsApp deixam de ser enviados. Os avisos no painel e por e-mail continuam.","Desconectar",()=>{S.wa.connected=false;audit("Desconectou o WhatsApp do sistema");toast("WhatsApp desconectado.","warn");paint()},true);
DO.waTest=()=>{const u=me();waSend("[Painel NFS-e] Mensagem de teste. Se você recebeu, o WhatsApp do sistema está funcionando.");if(!S.wa.log.length||S.wa.log[0].msg.indexOf("teste")<0)S.wa.log.unshift({t:new Date(),msg:"[Painel NFS-e] Mensagem de teste.",to:u.name.split(" ")[0],st:"Enviada (simulado)"});toast("Mensagem de teste enviada (simulado).","ok");paint()};
DO.waSave=()=>{const w=S.wa,ph={};let bad=null;$$("[data-waph]").forEach(i=>{const v=i.value.trim();if(!v){ph[i.dataset.waph]="";return}const f=waFmt(v);if(!f)bad=i;else ph[i.dataset.waph]=f});if(bad){bad.focus();return toast("Há um número inválido. Use DDD e 8 ou 9 dígitos.","err")}
  w.onlyHours=yes("waOnly");w.from=val("waFrom")||"08:00";w.to=val("waTo")||"18:00";w.maxHour=Math.max(1,Math.min(60,parseInt(val("waMax"))||20));w.hideSensitive=yes("waHide");w.ph=ph;$$("[data-waon]").forEach(i=>w.on[i.dataset.waon]=i.checked);$$("[data-waev]").forEach(i=>{const [k,r]=i.dataset.waev.split("|");w.ev[k][r]=i.checked});
  audit("Alterou as configurações de avisos por WhatsApp");toast("Configurações do WhatsApp salvas.","ok");paint()};

  let h=tb;
  if(LTAB==="levels"){
    h+=`<div class="grid g3">${NIVEIS.map((l,i)=>`<div class="card lvlcard ${i===cur?"cur":""}"><div class="spread"><h2 style="margin:0">${l.id}</h2>${i===cur?'<span class="badge b-ok">Em demonstração</span>':""}</div><p class="note">${l.sum}</p><dl class="kv"><dt>Prazo</dt><dd>${l.sem}</dd>${MOSTRAR_VALORES?`<dt>Horas</dt><dd>${l.h} h</dd><dt>Valor</dt><dd><b>${brl(l.v)}</b></dd><dt>Entrega para testes</dt><dd>${l.ent}</dd>`:""}</dl>${i===cur?"":`<button class="btn sm" data-do="setLvl" data-t="${i}">Demonstrar este nível</button>`}</div>`).join("")}</div>
    <div class="card mt"><h2>O que cada nível entrega</h2><div class="tablewrap"><table class="mx"><thead><tr><th>Funcionalidade</th>${NIVEIS.map((l,i)=>`<th class="${i===cur?"cur":""}">${l.id}</th>`).join("")}</tr></thead><tbody>${MX.map(r=>`<tr><td>${esc(r[0])}</td>${[1,2,3].map(j=>`<td class="${j-1===cur?"cur":""}">${mxCell(r[j])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <p class="note mt">${MOSTRAR_VALORES?"Valores de desenvolvimento, pagos uma vez, com o 1º ano de licença incluso. ":""}Hospedagem em VPS, API do Claude e caixa de e-mail são custos da Cruz, pagos direto aos fornecedores. O prazo considera 16 horas de trabalho por semana e começa quando as pendências da Cruz forem entregues.</p></div>`;
  }else if(LTAB==="phases"){
    const cell=(x)=>x?(MOSTRAR_VALORES?`${x[0]} h · ${x[1]} sem · ${brl(x[2])}`:'<span class="badge b-ok">Inclusa</span>'):'<span class="badge b-mute">Não incluída</span>';
    h+=`<div class="card"><h2>Fases do projeto</h2><p class="note">Cada fase é cobrada em duas metades: 50% ao iniciar e 50% na aceitação. A Cruz pode parar depois de qualquer fase.</p><div class="tablewrap"><table class="mx"><thead><tr><th>Fase</th>${NIVEIS.map((l,i)=>`<th class="${i===cur?"cur":""}">${l.id}</th>`).join("")}</tr></thead><tbody>${FASES.map(f=>`<tr><td>${esc(f[0])}</td>${[1,2,3].map(j=>`<td class="${j-1===cur?"cur":""}">${cell(f[j])}</td>`).join("")}</tr>`).join("")}${MOSTRAR_VALORES?`<tr><td><b>Total do desenvolvimento</b></td>${NIVEIS.map((l,i)=>`<td class="${i===cur?"cur":""}"><b>${l.h} h · ${brl(l.v)}</b></td>`).join("")}</tr>`:""}</tbody></table></div>
    ${MOSTRAR_VALORES?"":'<div class="callout mt">Horas e valores serão apresentados junto com a proposta, depois do teste de emissão em Produção Restrita.</div>'}</div>`;
  }else{
    const L=FEAT.filter(x=>x[2]!==1&&!/^Cancelamento/.test(x[1]));
    const bd=p=>p===2?'<span class="ph pho">Fora dos níveis</span>':p==="t"?'<span class="ph pht">Terceiros</span>':'<span class="ph pho">Opcional</span>';
    h+=`<div class="card"><h2>Fora dos três níveis</h2><p class="note">Itens que não estão incluídos em nenhum nível. Podem ser contratados à parte ou dependem de fornecedores. Cada um tem orçamento próprio.</p><div class="tablewrap"><table><thead><tr><th>Área</th><th>Recurso</th><th>Situação</th></tr></thead><tbody>${L.map(x=>`<tr><td>${x[0]}</td><td>${x[3]?optLink(x[3],esc(x[1])):esc(x[1])}</td><td>${bd(x[2])}</td></tr>`).join("")}</tbody></table></div></div>`;
  }
  return h};
const _paint4=window.paint;
window.paint=function(){
  if(VIEW==="cancel"&&NIV===0){
    const [t,s]=TITLES.cancel;$("#title").textContent=t;$("#subtitle").textContent=s;
    $("#view").innerHTML=lvlBar()+`<div class="card lock"><span class="badge b-mute">Não incluído no Essencial</span><h2 style="margin:10px 0">Cancelamento com autorização do Airton Senna</h2><p class="note">O cancelamento de notas, com aprovação do gerente, faz parte dos níveis Padrão e Ampliado.</p><div class="row" style="justify-content:center"><button class="btn primary" data-do="setLvl" data-t="1">Demonstrar o Padrão</button><button class="linkbtn" data-nav="phases">Comparar os níveis</button></div></div>`;
    lvlDecor();return}
  _paint4();
  const v=$("#view");v.insertAdjacentHTML("afterbegin",lvlBar());
  const n=NIV_NOTES[VIEW]&&NIV_NOTES[VIEW]();
  if(n)$(".lvlbar",v).insertAdjacentHTML("afterend",`<div class="callout" style="margin-bottom:14px"><span class="badge b-info">${NIVEIS[NIV].id}</span> ${esc(n)}</div>`);
  lvlDecor()};
function lvlDecor(){
  $$(".ph2").forEach(e=>{e.textContent=VIEW==="reports"?"Fora dos níveis":"Padrão e Ampliado"});
  $$("#nav button").forEach(b=>{const p=$(".pill.soon",b);if(!p)return;if(b.dataset.nav==="cancel")p.textContent="Padrão+";else if(b.dataset.nav==="reports")p.textContent="sob consulta"});
  $$("option").forEach(o=>{o.textContent=o.textContent.replace("(Fase 2)","(fora dos níveis)")});
  $$("button.linkbtn[data-nav=phases]").forEach(b=>{if(/fases/i.test(b.textContent)&&!b.closest(".lvlbar"))b.textContent="Ver níveis e recursos"})}

window.startLogin();
})();

</script>
